<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{include partial/head.html}}
<link rel="stylesheet" href="/viewer/space.css" />
<style>
  .embed #sidebar, .embed #sidebar-resizer, .embed #sidebar-scrim, .embed #btn-toggle-sidebar { display: none !important; }
  .embed header { display: none !important; }
</style>
</head>
<body data-page="collected" class="embed booting h-full bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden select-text">
  <div class="h-full flex flex-col">
    <div class="pane-bar"><span class="pane-kind">collected</span><span class="pane-sep">/</span><span id="pane-name" class="pane-name"></span>
      <div id="download-dd" class="relative">
        <button type="button" id="btn-download" title="Download" aria-haspopup="menu" aria-expanded="false" class="pane-button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[15px] w-[15px]">
            <path d="M12 3v12.5" />
            <path d="M6.5 10.5L12 16l5.5-5.5" />
            <path d="M3 21h18" />
          </svg>
        </button>
        <div id="download-menu" role="menu" aria-label="Download" class="hidden absolute right-0 top-full mt-1 z-50 w-64 rounded-xl bg-white shadow-lg p-3 enter-pop">
          <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Language</div>
          <div id="dl-langs" class="inline-flex items-center rounded-full bg-slate-100 p-0.5 mb-3" role="group" aria-label="Language">
            <button type="button" data-dl-lang="orig" class="seg-btn">Eng</button>
            <button type="button" data-dl-lang="trans" class="seg-btn">Korean</button>
            <button type="button" data-dl-lang="both" class="seg-btn">Line by line</button>
          </div>
          <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Format</div>
          <div id="dl-fmts" class="inline-flex items-center rounded-full bg-slate-100 p-0.5 mb-3" role="group" aria-label="Format">
            <button type="button" data-dl-fmt="md" class="seg-btn">Markdown</button>
            <button type="button" data-dl-fmt="pdf" class="seg-btn">PDF</button>
          </div>
          <button type="button" id="dl-go" class="w-full rounded-full bg-apple px-4 py-1.5 text-sm font-normal text-white hover:bg-apple-hover transition duration-150">Download</button>
        </div>
      </div>
    </div>
{{include partial/header.html}}
    <div class="flex-1 min-h-0 flex relative">
{{include partial/sidebar.html}}
      <div id="doc-pane" class="relative flex-1 min-w-0 min-h-0 flex flex-col bg-slate-50">
        <main id="doc-scroll" class="relative flex-1 min-h-0 overflow-y-auto select-text">
          <div id="doc-langbar" class="hidden sticky top-0 z-10 pointer-events-none">
            <div class="max-w-3xl mx-auto px-6 sm:px-10 pt-1 flex justify-end">
              <div class="pointer-events-auto inline-flex items-center rounded-full bg-slate-100/90 backdrop-blur p-0.5" role="tablist" aria-label="Document language">
                <button type="button" data-lang="orig" class="seg-btn">Eng</button>
                <button type="button" data-lang="trans" class="seg-btn">Korean</button>
                <button type="button" data-lang="both" class="seg-btn">Line by line</button>
              </div>
            </div>
          </div>
          <article id="doc-content" class="max-w-3xl mx-auto px-6 sm:px-10 py-8 pb-16" style="--doc-zoom: 1"></article>
        </main>
      </div>
    </div>
  </div>
{{include partial/overlay.html}}
  <script src="/viewer/app.js"></script>
  <script>
    window.addEventListener("research:quote", (e) => window.parent.workbench?.quote(e.detail));
    window.addEventListener("research:doc", (e) => {
      const name = document.getElementById("pane-name");
      name.textContent = e.detail.path.split("/").pop();
      name.title = e.detail.path;
      window.parent.workbench?.viewed(window.frameElement, e.detail);
    });
  </script>
  <script src="/viewer/pane.js"></script>
</body>
</html>
