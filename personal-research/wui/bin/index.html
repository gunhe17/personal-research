<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"SF Pro Text"', '"SF Pro Display"', "-apple-system", "BlinkMacSystemFont", "Inter", "Pretendard", "Apple SD Gothic Neo", "system-ui", "sans-serif"],
            mono: ['"SF Mono"', "ui-monospace", '"IBM Plex Mono"', "monospace"],
          },
          colors: {
            slate: {
              50: "#f5f5f7",
              100: "#e8e8ed",
              200: "#d2d2d7",
              300: "#b4b4b9",
              400: "#858585",
              500: "#707070",
              600: "#474747",
              700: "#333333",
              800: "#1d1d1f",
              900: "#1d1d1f",
              950: "#000000",
            },
            apple: {
              DEFAULT: "#0071e3",
              hover: "#0077ed",
              link: "#0066cc",
              signal: "#2997ff",
            },
          },
          borderRadius: {
            xl: "8px",
            "2xl": "12px",
            "3xl": "16px",
          },
          transitionTimingFunction: {
            spring: "cubic-bezier(0.22, 1, 0.36, 1)",
          },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style type="text/tailwindcss">
    html { font-synthesis: none; text-rendering: optimizeLegibility; }
    body, body * { -webkit-user-select: text; user-select: text; }
    ::selection { background-color: #b3d7ff; color: #1d1d1f; }
    body { letter-spacing: -0.016em; }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes modal-in { from { opacity: 0; transform: scale(0.97) translateY(8px); } }
    @keyframes dropdown-in { from { opacity: 0; transform: translateY(-4px); } }
    @keyframes doc-in { from { opacity: 0; transform: translateY(4px); } }
    @keyframes step-in { from { opacity: 0; transform: translateY(-4px); } }
    .step-in { animation: step-in 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
    .breathe { animation: breathe 1.4s ease-in-out infinite; }
    @keyframes sweep { to { background-position: 200% 0; } }
    .sweep {
      background-image: linear-gradient(90deg, #1d1d1f 0%, #1d1d1f 40%, #0071e3 50%, #1d1d1f 60%, #1d1d1f 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: sweep 2.2s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .sweep, .step-in { animation: none; }
      .sweep { color: #1d1d1f; }
    }
    .doc-in { animation: doc-in 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes chat-in { from { opacity: 0; transform: translateX(16px); } }
    @keyframes chat-in-mobile { from { opacity: 0; transform: translateY(16px); } }
    .chat-in { animation: chat-in 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
    @media print {
      @page { margin: 18mm; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      header, #sidebar, #split-resizer, #chat-panel, #doc-langbar, #toast, #settings-modal { display: none !important; }
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      body > div, #workspace, #doc-pane, #doc-scroll {
        height: auto !important; min-height: 0 !important; overflow: visible !important; display: block !important;
      }
      #doc-pane { background: #fff !important; }
      #doc-content { max-width: none !important; padding: 0 !important; --doc-zoom: 1 !important; }
      .prose-doc a { color: inherit !important; text-decoration: none !important; }
      .prose-doc h1, .prose-doc h2, .prose-doc h3 { break-after: avoid; }
      .prose-doc pre, .prose-doc table, .prose-doc img, .prose-doc blockquote { break-inside: avoid; }
      .il-pair { break-inside: avoid; }
    }
    @media (max-width: 767px) {
      #input { font-size: 16px; }
      .chat-in { animation-name: chat-in-mobile; }
    }
    @layer components {
      .icon-btn {
        @apply h-7 w-7 inline-flex items-center justify-center rounded-md text-slate-600
               hover:bg-slate-100 hover:text-slate-900 transition duration-150 active:scale-[0.96]
               focus:outline-none focus-visible:ring-2 focus-visible:ring-apple/30;
      }
      #doc-content {
        font-size: calc(15px * var(--doc-zoom, 1));
      }
      #chat-panel, #home-pane {
        --chat-zoom: 1;
      }
      #messages, #home-messages {
        font-size: calc(14px * var(--chat-zoom, 1));
      }
      #citations {
        font-size: calc(12px * var(--chat-zoom, 1));
      }
      #input {
        font-size: calc(14px * var(--chat-zoom, 1));
      }
      .prose-doc h1 { @apply font-semibold tracking-tight text-slate-900 mb-4; font-size: 1.75em; }
      .prose-doc h2 { @apply font-semibold text-slate-900 mt-10 mb-3; font-size: 1.35em; }
      .prose-doc h3 { @apply font-semibold text-slate-800 mt-6 mb-2; font-size: 1.1em; }
      .prose-doc p { @apply leading-relaxed text-slate-700 my-3; font-size: 1em; }
      .prose-doc a { @apply text-apple-link no-underline hover:underline underline-offset-2; }
      .prose-doc ul { @apply list-disc pl-5 my-3 space-y-1 text-slate-700; font-size: 1em; }
      .prose-doc ol { @apply list-decimal pl-5 my-3 space-y-1 text-slate-700; font-size: 1em; }
      .prose-doc code { @apply font-mono bg-slate-100 text-slate-800 px-1.5 py-0.5 rounded; font-size: 0.9em; }
      .prose-doc pre { @apply bg-white rounded-xl p-4 overflow-x-auto my-4; font-size: 0.88em; }
      .prose-doc pre code { @apply bg-transparent p-0; }
      .prose-doc table { @apply w-full border-collapse my-4; font-size: 0.92em; }
      .prose-doc th { @apply border-b border-slate-200 px-3 py-2 text-left font-semibold text-slate-800; }
      .prose-doc td { @apply border-b border-slate-100 px-3 py-2 text-slate-700 align-top; }
      .prose-doc blockquote { @apply border-l-4 border-slate-400 bg-slate-50 pl-4 py-1 my-4 text-slate-600; }
      .prose-doc hr { @apply border-0 border-t border-slate-200 my-8; }
      .prose-doc img { @apply max-w-full rounded-lg my-4; box-shadow: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px; }
      .prose-doc ::selection { background-color: #b3d7ff; color: #1d1d1f; }
      mark.doc-active-sel {
        background-color: #d1e8ff;
        color: #1d1d1f;
        border-radius: 2px;
        padding: 0;
      }
      #doc-content pre.raw-doc { font-size: 0.92em; }
      /* language segmented control */
      .seg-btn {
        @apply rounded-full px-3 py-1 text-[12px] text-slate-600 hover:text-slate-900 transition duration-150;
      }
      .seg-btn[aria-selected="true"] {
        @apply bg-white text-slate-900 font-medium;
      }
      .il-orig > * { margin-bottom: 2px; }
      .il-trans { margin-bottom: 14px; }
      .il-trans > * { margin-top: 2px; color: #474747; font-size: 0.95em; }
      .il-pair { margin-bottom: 18px; }
      .il-pair .il-s-orig { margin: 0; line-height: 1.55; color: #1d1d1f; }
      .il-pair .il-s-trans { margin: 1px 0 10px; line-height: 1.55; color: #707070; font-size: 0.95em; }
      .il-pair .il-s-trans:last-child { margin-bottom: 0; }
      .md-chat {
        @apply text-slate-800 leading-relaxed break-words;
        font-size: 1em;
        overflow-wrap: anywhere;
      }
      .md-chat > :first-child { margin-top: 0; }
      .md-chat > :last-child { margin-bottom: 0; }
      .md-chat p { @apply my-2 leading-relaxed text-slate-800; }
      .md-chat h1 { @apply font-semibold text-slate-900 mt-3 mb-1.5 tracking-tight; font-size: 1.15em; }
      .md-chat h2 { @apply font-semibold text-slate-900 mt-3 mb-1.5 tracking-tight; font-size: 1.05em; }
      .md-chat h3, .md-chat h4 { @apply font-semibold text-slate-800 mt-2.5 mb-1; font-size: 1em; }
      .md-chat ul { @apply list-disc pl-4 my-2 space-y-1 text-slate-800; }
      .md-chat ol { @apply list-decimal pl-4 my-2 space-y-1 text-slate-800; }
      .md-chat li { @apply my-0.5; }
      .md-chat li > p { @apply my-1; }
      .md-chat code { @apply font-mono text-[0.85em] bg-slate-100 text-slate-800 px-1 py-0.5 rounded; }
      .md-chat pre { @apply bg-slate-900 text-slate-50 border border-slate-700 rounded-lg p-2.5 overflow-x-auto text-xs my-2 max-w-full; }
      .md-chat pre code { @apply bg-transparent text-slate-50 p-0 text-xs; }
      .md-chat a { @apply text-apple-link no-underline hover:underline font-normal underline-offset-2; }
      .md-chat strong { @apply text-slate-950 font-semibold; }
      .md-chat em { @apply italic text-slate-800; }
      .md-chat blockquote {
        @apply border-l-4 border-slate-300 bg-slate-50 pl-3 py-1 my-2 text-slate-600 text-[0.95em];
      }
      .md-chat hr { @apply border-0 border-t border-slate-200 my-3; }
      .md-chat img { @apply max-w-full h-auto rounded-md my-2; }
      .md-chat .md-table-wrap {
        @apply my-2.5 max-w-full overflow-x-auto rounded-lg border border-slate-200 bg-white;
        -webkit-overflow-scrolling: touch;
      }
      .md-chat table {
        @apply w-full border-collapse text-left;
        font-size: 0.82em;
        min-width: 100%;
      }
      .md-chat thead { @apply bg-slate-50; }
      .md-chat th {
        @apply border-b border-slate-200 px-2.5 py-1.5 font-semibold text-slate-800 whitespace-nowrap align-bottom;
      }
      .md-chat td {
        @apply border-b border-slate-100 px-2.5 py-1.5 text-slate-700 align-top;
      }
      .md-chat tbody tr:last-child td { @apply border-b-0; }
      .md-chat tbody tr:nth-child(even) { @apply bg-slate-50/60; }
      .md-chat th:not(:last-child),
      .md-chat td:not(:last-child) {
        border-right: 1px solid #e8e8ed;
      }
      button.cite-open {
        @apply w-full text-left cursor-pointer transition;
      }
      button.cite-open:hover {
        filter: brightness(1.06);
      }
      button.cite-open:focus-visible {
        @apply outline-none ring-2 ring-apple/40 ring-offset-1;
      }
      .msg-row {
        @apply flex gap-2.5 min-w-0 max-w-full;
      }
      .msg-row--user {
        @apply flex-row-reverse;
      }
      .msg-row--agent {
        @apply flex-row;
      }
      .msg-col {
        @apply min-w-0 flex flex-col gap-1;
        max-width: min(100%, 36rem);
      }
      .msg-row--user .msg-col {
        @apply items-end;
      }
      .msg-row--agent .msg-col {
        @apply items-start;
        max-width: 100%;
        flex: 1;
      }
      .msg-bubble {
        @apply min-w-0 max-w-full leading-relaxed;
        font-size: 1em;
      }
      .msg-bubble--user {
        @apply rounded-2xl rounded-tr-md bg-slate-900 text-white px-3.5 py-2.5;
      }
      .msg-bubble--agent {
        @apply rounded-2xl rounded-tl-md bg-white text-slate-900 px-3.5 py-2.5;
      }
      .msg-bubble--system {
        @apply rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-2 text-xs text-slate-600;
      }
      .msg-sources {
        @apply w-full mt-1 space-y-1;
      }
      .typing-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 1rem;
      }
      .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #707070; /* Ash */
        animation: typing-bounce 1.2s ease-in-out infinite;
      }
      .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes typing-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
        30% { transform: translateY(-3px); opacity: 1; }
      }
      .stream-cursor {
        display: inline-block;
        width: 2px;
        height: 0.95em;
        margin-left: 2px;
        vertical-align: text-bottom;
        background: #1d1d1f;
        animation: stream-blink 1s step-end infinite;
      }
      @keyframes stream-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    }
    ::highlight(doc-active-sel) {
      background-color: #d1e8ff;
      color: #1d1d1f;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden select-text">
  <div class="h-full flex flex-col">
    <!-- Global nav bar -->
    <header class="shrink-0 h-11 flex items-center bg-white/90 backdrop-blur border-b border-slate-100 px-4 relative z-40">
      <div class="flex-1 flex items-center">
        <button type="button" id="btn-toggle-sidebar" title="Toggle sidebar" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
          </svg>
        </button>
      </div>
      <div class="flex-1 flex items-center justify-end gap-1">
        <div id="download-dd" class="relative">
          <button type="button" id="btn-download" title="Download" aria-haspopup="menu" aria-expanded="false" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
              <path d="M12 3v12.5" />
              <path d="M6.5 10.5L12 16l5.5-5.5" />
              <path d="M3 21h18" />
            </svg>
          </button>
          <div id="download-menu" role="menu" aria-label="Download" class="hidden absolute right-0 top-full mt-1 z-50 w-64 rounded-xl bg-white shadow-lg p-3 animate-[dropdown-in_0.18s_cubic-bezier(0.22,1,0.36,1)]">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Language</div>
            <div id="dl-langs" class="inline-flex items-center rounded-full bg-slate-100 p-0.5 mb-3" role="group" aria-label="Language">
              <button type="button" data-dl-lang="orig" class="seg-btn">Eng</button>
              <button type="button" data-dl-lang="trans" class="seg-btn">Korean</button>
              <button type="button" data-dl-lang="both" class="seg-btn">Line by line</button>
            </div>
            <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Format</div>
            <div id="dl-fmts" class="inline-flex items-center rounded-full bg-slate-100 p-0.5 mb-3" role="group" aria-label="Format">
              <button type="button" data-dl-fmt="md" class="seg-btn">Markdown</button>
              <button type="button" data-dl-fmt="pdf" class="seg-btn">PDF</button>
            </div>
            <button type="button" id="dl-go" class="w-full rounded-full bg-apple px-4 py-1.5 text-sm font-normal text-white hover:bg-apple-hover transition duration-150">Download</button>
          </div>
        </div>
        <button type="button" id="btn-settings" title="Settings" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
            <g transform="translate(12 12) scale(0.8182) translate(-12 -12)" stroke-width="1.833">
              <circle cx="12" cy="12" r="3.25" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </g>
          </svg>
        </button>
        <button type="button" id="btn-toggle-chat" title="Toggle chat (⌘N)" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[18px] w-[18px]">
            <path d="M21 11a8 8 0 0 1-8 8H6.5L3 21V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="flex-1 min-h-0 flex relative">
    <div id="sidebar-scrim" class="hidden md:!hidden absolute inset-0 z-20 bg-slate-900/20 transition-opacity"></div>
    <!-- Sidebar -->
    <aside
      id="sidebar"
      class="h-full shrink-0 flex flex-col bg-white overflow-hidden transition-all duration-300 ease-spring max-md:absolute max-md:inset-y-0 max-md:left-0 max-md:z-30 max-md:shadow-lg"
      style="width: 18rem"
    >
      <div id="tree" class="flex-1 min-h-0 overflow-y-auto px-2 pt-2 pb-2 text-sm"></div>
    </aside>

    <!-- sidebar resizer -->
    <div
      id="sidebar-resizer"
      title="Drag to resize"
      class="group relative z-20 w-px shrink-0 cursor-col-resize bg-slate-100 hover:bg-slate-300 active:bg-apple transition-colors max-md:!hidden"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize sidebar"
    >
      <div class="absolute inset-y-0 -left-2.5 -right-2.5"></div>
      <div class="pointer-events-none absolute left-1/2 top-1/2 h-10 w-1 -translate-x-1/2 -translate-y-1/2 rounded-full bg-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
    </div>

    <!-- Workspace -->
    <div id="workspace" class="relative flex-1 min-w-0 min-h-0 flex">
      <!-- Home -->
      <section id="home-pane" class="relative flex-1 min-w-0 min-h-0 overflow-hidden bg-slate-50">
        <div id="home-inner" class="mx-auto flex h-full w-full max-w-2xl flex-col justify-center px-6 pb-10">
          <h1 id="home-title" class="text-center text-[40px] font-semibold tracking-tight text-slate-800" style="letter-spacing: 0.44px">
            오늘의 research는 무엇인가요?
          </h1>
          <div id="home-messages" class="hidden min-h-0 flex-1 space-y-3 overflow-y-auto overflow-x-hidden py-6"></div>
          <div
            id="home-bar"
            class="mt-8 flex items-center gap-2.5 rounded-2xl bg-white px-2.5 py-2.5 ring-1 ring-slate-200 focus-within:ring-2 focus-within:ring-apple/20 transition"
          >
            <div id="home-mode" class="relative shrink-0 self-center">
              <button
                type="button"
                id="home-mode-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                class="inline-flex items-center gap-1 rounded-full bg-slate-100 pl-3 pr-2 py-1 text-[13px] text-slate-700 hover:bg-slate-200/70 transition duration-150"
              >
                <span id="home-mode-label">ask</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 text-slate-400">
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div
                id="home-mode-menu"
                role="listbox"
                class="hidden absolute left-0 bottom-full mb-2 z-50 w-56 rounded-xl bg-white p-1 shadow-lg ring-1 ring-slate-200 animate-[dropdown-in_0.18s_cubic-bezier(0.22,1,0.36,1)]"
              >
                <button type="button" role="option" data-home-mode="ask" class="block w-full rounded-lg px-3 py-2 text-left hover:bg-slate-50 transition duration-150">
                  <span class="block text-[13px] font-medium text-slate-800">ask</span>
                  <span class="block text-[11px] text-slate-500">Answer from collected documents</span>
                </button>
                <button type="button" role="option" data-home-mode="collect" class="block w-full rounded-lg px-3 py-2 text-left hover:bg-slate-50 transition duration-150">
                  <span class="block text-[13px] font-medium text-slate-800">collect</span>
                  <span class="block text-[11px] text-slate-500">Fetch a URL and translate it</span>
                </button>
              </div>
            </div>
            <textarea
              id="home-input"
              rows="1"
              style="height: 34px"
              class="min-w-0 flex-1 self-center resize-none max-h-60 overflow-y-auto bg-transparent py-1 text-[17px] leading-[1.5] text-slate-900 placeholder:text-slate-400 focus:outline-none"
            ></textarea>
            <button
              type="button"
              id="home-send"
              title="Send (Enter)"
              aria-label="Send"
              class="shrink-0 self-center h-8 w-8 inline-flex items-center justify-center rounded-full bg-apple text-white hover:bg-apple-hover disabled:opacity-40 disabled:cursor-not-allowed transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                <path d="M12 20V4" />
                <path d="M5 11l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <div id="doc-pane" class="relative flex-1 min-w-0 min-h-0 flex flex-col bg-slate-50">
        <main id="doc-scroll" class="relative flex-1 min-h-0 overflow-y-auto select-text">
          <div id="doc-langbar" class="hidden sticky top-0 z-10 pointer-events-none">
            <div class="max-w-3xl mx-auto px-6 sm:px-10 pt-3 flex justify-end">
              <div class="pointer-events-auto inline-flex items-center rounded-full bg-slate-100/90 backdrop-blur p-0.5" role="tablist" aria-label="Document language">
                <button type="button" data-lang="orig" class="seg-btn">Eng</button>
                <button type="button" data-lang="trans" class="seg-btn">Korean</button>
                <button type="button" data-lang="both" class="seg-btn">Line by line</button>
              </div>
            </div>
          </div>
          <article id="doc-content" class="max-w-3xl mx-auto px-6 sm:px-10 py-10 pb-16" style="--doc-zoom: 1"></article>

        </main>
      </div>

      <!-- Horizontal resizer -->
      <div
        id="split-resizer"
        title="Drag to resize"
        class="group relative z-20 w-px shrink-0 cursor-col-resize bg-slate-100 hover:bg-slate-300 active:bg-apple transition-colors max-md:!hidden"
        role="separator"
        aria-orientation="vertical"
        aria-label="DocumentsResize the chat panel"
      >
        <div class="absolute inset-y-0 -left-2.5 -right-2.5"></div>
        <div class="pointer-events-none absolute left-1/2 top-1/2 h-10 w-1 -translate-x-1/2 -translate-y-1/2 rounded-full bg-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
      </div>

      <!-- Chat panel -->
      <aside
        id="chat-panel"
        class="h-full shrink-0 flex flex-col min-w-0 bg-white overflow-visible select-text max-md:absolute max-md:inset-0 max-md:!w-full max-md:border-l-0 max-md:z-20"
        style="width: 50%"
      >
        <!-- chat header -->
        <div class="shrink-0 h-11 flex items-center gap-1 bg-white px-3 relative z-20">
          <!-- Custom history dropdown -->
          <div id="history-dd" class="relative min-w-0 flex-1">
            <button
              type="button"
              id="btn-history"
              title="Chat history"
              aria-haspopup="listbox"
              aria-expanded="false"
              class="w-full flex items-center gap-1.5 rounded-lg px-2 py-1 text-left hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-apple/20 transition duration-150"
            >
              <div class="min-w-0 flex-1 flex items-baseline gap-1.5">
                <span class="text-[13px] font-semibold tracking-tight text-slate-900">Agent</span>
                <span id="chat-sub" class="text-[11px] text-slate-500 truncate">New chat</span>
              </div>
              <svg id="history-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-4 w-4 shrink-0 text-slate-400 transition-transform">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>

            <div
              id="history-dropdown"
              role="listbox"
              aria-label="Chat history"
              class="hidden absolute left-0 right-0 top-full mt-1 z-50 overflow-hidden rounded-xl bg-white shadow-lg animate-[dropdown-in_0.18s_cubic-bezier(0.22,1,0.36,1)]"
            >
              <div class="flex items-center px-3 py-2">
                <span class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Chat history</span>
              </div>
              <div id="history-list" class="max-h-64 overflow-y-auto py-1"></div>
            </div>
          </div>

          <button type="button" id="btn-new-chat" title="New chat" class="icon-btn shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-4 w-4"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>

        <div id="messages" class="flex-1 min-h-0 min-w-0 overflow-y-auto overflow-x-hidden p-3 sm:p-4 space-y-3 bg-slate-50"></div>

        <!-- composer -->
        <div class="shrink-0 bg-white p-3 space-y-2">
          <div id="citations" class="hidden space-y-1.5 max-h-32 overflow-y-auto"></div>
          <div
            id="composer-box"
            class="relative rounded-2xl bg-slate-50 focus-within:bg-white focus-within:ring-2 focus-within:ring-apple/20 transition"
          >
            <textarea
              id="input"
              rows="2"
              placeholder="Ask a question…"
              class="w-full resize-none min-h-[3rem] max-h-36 bg-transparent px-3.5 pt-3 pb-11 text-slate-900 placeholder:text-slate-400 focus:outline-none disabled:text-slate-500"
            ></textarea>
            <div class="absolute bottom-2 right-2 flex items-center gap-1.5">
              <button
                type="button"
                id="btn-send"
                title="Send (Enter)"
                aria-label="Send"
                class="h-8 w-8 inline-flex items-center justify-center rounded-full bg-apple text-white hover:bg-apple-hover disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                  <path d="M12 19V5" />
                  <path d="M5 12l7-7 7 7" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </aside>

    </div>
    </div>
  </div>

  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-[fade-in_0.2s_ease-out]">
    <div class="w-full max-w-md max-h-[90vh] flex flex-col rounded-3xl bg-white shadow-2xl overflow-hidden animate-[modal-in_0.28s_cubic-bezier(0.22,1,0.36,1)]">
      <div class="shrink-0 flex items-center gap-2 px-5 pt-5 pb-3">
        <h3 class="text-sm font-semibold text-slate-900 flex-1">Settings</h3>
        <button type="button" id="btn-close-settings" class="icon-btn shrink-0" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-4 w-4"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-5">
        <!-- Document font size -->
        <section>
          <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Document text size</h4>
          <p class="text-[11px] text-slate-400 mb-2">Document viewer · ⌘+ / ⌘− / ⌘0</p>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-doc-font-down" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Smaller document text">A−</button>
            <span id="doc-font-label" class="min-w-[3.5rem] text-center font-mono text-sm font-semibold text-slate-800 tabular-nums">100%</span>
            <button type="button" id="btn-doc-font-up" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Larger document text">A+</button>
            <button type="button" id="btn-doc-font-reset" class="ml-1 rounded-full border border-slate-200 px-3 h-9 text-[11px] font-medium text-slate-600 hover:bg-slate-50" aria-label="Default document size">Default</button>
          </div>
        </section>

        <!-- Chat font size -->
        <section>
          <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Chat text size</h4>
          <p class="text-[11px] text-slate-400 mb-2">messages, composer and quotes</p>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-chat-font-down" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Smaller chat text">A−</button>
            <span id="chat-font-label" class="min-w-[3.5rem] text-center font-mono text-sm font-semibold text-slate-800 tabular-nums">100%</span>
            <button type="button" id="btn-chat-font-up" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Larger chat text">A+</button>
            <button type="button" id="btn-chat-font-reset" class="ml-1 rounded-full border border-slate-200 px-3 h-9 text-[11px] font-medium text-slate-600 hover:bg-slate-50" aria-label="Default chat size">Default</button>
          </div>
        </section>
      </div>
      <div class="shrink-0 flex justify-end gap-2 px-5 py-3 bg-slate-50/80">
        <button type="button" id="btn-cancel-settings" class="rounded-full border border-slate-200 px-4 py-1.5 text-sm font-normal text-slate-700 hover:bg-slate-50 transition duration-150">Cancel</button>
        <button type="button" id="btn-save-settings" class="rounded-full bg-apple px-4 py-1.5 text-sm font-normal text-white hover:bg-apple-hover">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] -translate-x-1/2 translate-y-1 rounded-full bg-white px-4 py-2 text-sm text-slate-800 shadow-lg opacity-0 transition-all duration-300 ease-spring"></div>
  <div id="sel-bar" class="hidden fixed z-[55] items-center gap-0.5 rounded-full border border-slate-200 bg-white p-0.5">
    <button type="button" id="sel-chat" title="Quote in chat (hold ⇧ while selecting to append)" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z" />
      </svg>
    </button>
    <button type="button" id="sel-copy" title="Copy" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <path d="M5 15V6a2 2 0 0 1 2-2h8" />
      </svg>
    </button>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const state = {
      sidebarOpen: false,
      sidebarWidth: clampSidebar(parseFloat(localStorage.getItem("sidebarWidth") || "288") || 288),
      resizingSidebar: false,
      chatOpen: localStorage.getItem("chatOpen") !== "0",
      chatWidthPct: clampChatWidth(parseFloat(localStorage.getItem("chatWidthPct") || "50") || 50),
      tree: [],
      currentPath: null,
      currentId: null,
      view: "home",
      related: [],
      homeMode: localStorage.getItem("homeMode") || "ask",
      currentTitle: null,
      currentText: "",
      citations: [],
      conversation: null,
      messages: [],
      sending: false,
      lastSelection: "",
      pendingSel: null,
      docLang: localStorage.getItem("docLang") || "orig",
      dlLang: "orig",
      dlFmt: localStorage.getItem("dlFmt") || "md",
      docPair: null,
      pairTexts: null,
      nodeById: new Map(),
      docZoom: clampZoom(parseFloat(localStorage.getItem("docZoom") || "1") || 1),
      chatZoom: clampZoom(parseFloat(localStorage.getItem("chatZoom") || "1") || 1),
      resizingSplit: false,
      docSelRange: null,
    };

    function clampSidebar(px) {
      return Math.min(480, Math.max(200, Math.round(px)));
    }

    function clampChatWidth(pct) {
      return Math.min(70, Math.max(25, Math.round(pct * 10) / 10));
    }

    function clampZoom(z) {
      return Math.min(1.75, Math.max(0.8, Math.round(z * 100) / 100));
    }

    function wireZoomButtons(downId, upId, zoom) {
      const down = $(downId);
      const up = $(upId);
      if (down) {
        down.disabled = zoom <= 0.8;
        down.classList.toggle("opacity-40", zoom <= 0.8);
      }
      if (up) {
        up.disabled = zoom >= 1.75;
        up.classList.toggle("opacity-40", zoom >= 1.75);
      }
    }

    function applyDocZoom() {
      const el = $("#doc-content");
      if (el) el.style.setProperty("--doc-zoom", String(state.docZoom));
      const label = $("#doc-font-label");
      if (label) label.textContent = Math.round(state.docZoom * 100) + "%";
      localStorage.setItem("docZoom", String(state.docZoom));
      wireZoomButtons("#btn-doc-font-down", "#btn-doc-font-up", state.docZoom);
    }

    function applyChatZoom() {
      for (const id of ["#chat-panel", "#home-pane"]) {
        const el = $(id);
        if (el) el.style.setProperty("--chat-zoom", String(state.chatZoom));
      }
      const label = $("#chat-font-label");
      if (label) label.textContent = Math.round(state.chatZoom * 100) + "%";
      localStorage.setItem("chatZoom", String(state.chatZoom));
      wireZoomButtons("#btn-chat-font-down", "#btn-chat-font-up", state.chatZoom);
    }

    function markSettings(open) {
      const btn = $("#btn-settings");
      if (btn) btn.classList.toggle("text-apple", open);
    }

    function openSettings() {
      applyDocZoom();
      applyChatZoom();
      const m = $("#settings-modal");
      m.classList.remove("hidden");
      m.classList.add("flex");
      markSettings(true);
    }

    function closeSettings() {
      const m = $("#settings-modal");
      m.classList.add("hidden");
      m.classList.remove("flex");
      markSettings(false);
    }

    function setDocZoom(z) {
      state.docZoom = clampZoom(z);
      applyDocZoom();
    }

    function setChatZoom(z) {
      state.chatZoom = clampZoom(z);
      applyChatZoom();
    }

    function toast(msg) {
      const el = $("#toast");
      el.textContent = msg;
      el.classList.remove("opacity-0", "translate-y-1");
      el.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        el.classList.add("opacity-0", "translate-y-1");
        el.classList.remove("opacity-100", "translate-y-0");
      }, 2000);
    }

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    // Sidebar
    function applySidebar() {
      const sb = $("#sidebar");
      const rz = $("#sidebar-resizer");
      if (state.sidebarOpen) {
        sb.style.width = state.sidebarWidth + "px";
        sb.style.opacity = "1";
      } else {
        sb.style.width = "0px";
        sb.style.opacity = "0";
      }
      const navBtn = $("#btn-toggle-sidebar");
      if (navBtn) navBtn.classList.toggle("text-apple", state.sidebarOpen);
      if (rz) rz.style.display = state.sidebarOpen ? "" : "none";
      $("#sidebar-scrim").classList.toggle("hidden", !state.sidebarOpen);
      localStorage.setItem("sidebarWidth", String(state.sidebarWidth));
    }

    function renderTreeNodes(nodes, depth = 0) {
      const frag = document.createDocumentFragment();
      for (const n of nodes) {
        if (n.type === "dir") {
          const wrap = document.createElement("div");
          wrap.className = "mb-0.5";
          const row = document.createElement("button");
          row.type = "button";
          row.className = "w-full flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-left text-slate-700 hover:bg-slate-50 transition duration-150";
          row.style.paddingLeft = `${8 + depth * 12}px`;
          const open = n._open !== false;
          row.innerHTML = `
            <span class="inline-block w-3 text-slate-500 text-[13px] leading-none transition-transform ${open ? "rotate-90" : ""}">›</span>
            <span class="truncate font-medium text-slate-800">${escapeHtml(n.name)}</span>`;
          const kids = document.createElement("div");
          kids.className = open ? "" : "hidden";
          kids.appendChild(renderTreeNodes(n.children || [], depth + 1));
          row.addEventListener("click", () => {
            n._open = !(n._open !== false);
            renderTree();
          });
          wrap.appendChild(row);
          wrap.appendChild(kids);
          frag.appendChild(wrap);
        } else {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.style.paddingLeft = `${8 + depth * 12 + 14}px`;
          const active = state.currentId === n.id;
          btn.className = active
            ? "w-full rounded-lg px-2 py-1.5 text-left text-sm bg-apple text-white font-medium mb-0.5 transition duration-150"
            : "w-full rounded-lg px-2 py-1.5 text-left text-sm text-slate-600 hover:bg-slate-50 mb-0.5 transition duration-150";
          btn.innerHTML = `<span class="truncate block">${escapeHtml(n.name)}</span>`;
          btn.title = n.path;
          btn.addEventListener("click", () => {
            openFile(n.id);
            if (window.matchMedia("(max-width: 767px)").matches) {
              state.sidebarOpen = false;
              applySidebar();
            }
          });
          frag.appendChild(btn);
        }
      }
      return frag;
    }

    function sectionLabel(name, action) {
      const el = document.createElement("div");
      el.className = "flex items-center justify-between px-2 pt-3 pb-1";
      el.innerHTML = `<span class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">${escapeHtml(name)}</span>`;
      if (action) el.appendChild(action);
      return el;
    }

    function collapseButton() {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.title = "Collapse all";
      btn.className = "h-5 w-5 inline-flex items-center justify-center rounded text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition duration-150";
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
        <path d="M7 20l5-5 5 5" /><path d="M7 4l5 5 5-5" /></svg>`;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        collapseAllDirs(state.tree);
        renderTree();
      });
      return btn;
    }

    function sinceLabel(iso) {
      if (!iso) return "";
      const then = new Date(iso);
      if (isNaN(then)) return "";
      const minutes = Math.floor((Date.now() - then.getTime()) / 60000);
      if (minutes < 1) return "just now";
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}d ago`;
      return then.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function sidebarRow({ label, active, icon, onClick, indent = 8, title, meta }) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.style.paddingLeft = `${indent}px`;
      btn.className = active
        ? "w-full flex items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm bg-apple text-white font-medium mb-0.5 transition duration-150"
        : "w-full flex items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm text-slate-600 hover:bg-slate-50 mb-0.5 transition duration-150";
      btn.innerHTML = `${icon || ""}<span class="truncate block flex-1 min-w-0">${escapeHtml(label)}</span>${
        meta ? `<span class="shrink-0 text-[10px] ${active ? "text-white/70" : "text-slate-400"}">${escapeHtml(meta)}</span>` : ""
      }`;
      if (title) btn.title = title;
      btn.addEventListener("click", onClick);
      return btn;
    }

    const HOME_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
      <path d="M3 11.5L12 3l9 8.5" /><path d="M5.5 10v10h13V10" /></svg>`;

    const COLLECTED_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0">
      <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z" /></svg>`;

    function renderTree() {
      const tree = $("#tree");
      tree.innerHTML = "";
      tree.appendChild(sidebarRow({
        label: "Home",
        active: state.view === "home",
        icon: HOME_ICON,
        onClick: () => openHome(),
      }));
      tree.appendChild(sidebarRow({
        label: "Collected",
        active: state.view === "collected",
        icon: COLLECTED_ICON,
        onClick: () => openCollected(),
      }));

      const under = document.createElement("div");
      under.className = "ml-3 border-l border-slate-100 pl-1";
      tree.appendChild(under);

      if (state.related.length) {
        under.appendChild(sectionLabel("Related"));
        for (const item of state.related.slice(0, 5)) {
          under.appendChild(sidebarRow({
            label: item.path.split("/").pop(),
            active: state.currentId === item.id,
            title: item.path,
            meta: sinceLabel(item.opened_at),
            onClick: () => openFile(item.id),
          }));
        }
      }

      under.appendChild(sectionLabel("List", collapseButton()));
      if (!state.tree.length) {
        under.insertAdjacentHTML("beforeend", `<div class="px-2 py-2 text-xs text-slate-500">Nothing collected, or the server is unreachable</div>`);
        return;
      }
      under.appendChild(renderTreeNodes(state.tree));
    }

    async function loadRelated(id) {
      try {
        const res = await fetch("/api/related" + (id ? "?id=" + encodeURIComponent(id) : ""));
        if (!res.ok) return;
        state.related = (await res.json()).items || [];
      } catch {
        state.related = [];
      }
      renderTree();
    }

    function collapseAllDirs(nodes) {
      for (const n of nodes) {
        if (n.type !== "dir") continue;
        n._open = false;
        collapseAllDirs(n.children || []);
      }
    }

    async function loadTree() {
      const res = await fetch("/api/tree");
      if (!res.ok) throw new Error("tree failed");
      const data = await res.json();
      state.tree = data.tree || [];
      collapseAllDirs(state.tree);
      state.nodeById = new Map();
      (function collect(nodes) {
        for (const n of nodes) {
          if (n.type === "dir") collect(n.children || []);
          else {
            state.nodeById.set(n.id, n);
          }
        }
      })(state.tree);
      renderTree();
    }

    // i18n
    function translationOf(id) {
      const node = state.nodeById.get(id);
      if (!node || !/\.(md|markdown|mdx)$/i.test(node.path)) return null;
      return node.languages.includes("kor") ? { orig: "eng", trans: "kor" } : null;
    }

    async function fetchMeta(id) {
      try {
        const res = await fetch("/api/meta?id=" + encodeURIComponent(id));
        if (!res.ok) return null;
        return res.json();
      } catch {
        return null;
      }
    }

    function sourceLine() {
      const src = state.currentMeta && state.currentMeta.url;
      if (!src) return "";
      return `<p class="doc-in mb-4 text-[12px] text-slate-500 break-all">Source <a href="${escapeHtml(src)}" target="_blank" rel="noopener" class="text-apple-link hover:underline">${escapeHtml(src)}</a></p>`;
    }

    async function fetchFile(id, language) {
      const res = await fetch("/api/file?id=" + encodeURIComponent(id) + "&language=" + language);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function rawUrl(id, language) {
      return "/api/raw?id=" + encodeURIComponent(id) + "&language=" + language;
    }

    function splitSentences(text) {
      return (text || "").match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text];
    }

    function interleaveMd(orig, trans) {
      const strip = (tokens) => tokens.filter((t) => t.type !== "space");
      const a = strip(marked.lexer(orig || ""));
      const b = strip(marked.lexer(trans || ""));
      let html = "";
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const pa = a[i], pb = b[i];
        const differs = pa && pb && pb.raw.trim() !== pa.raw.trim();
        if (differs && pa.type === "paragraph" && pb.type === "paragraph") {
          const sa = splitSentences(pa.raw.trim());
          const sb = splitSentences(pb.raw.trim());
          if (sa.length === sb.length) {
            html += `<div class="il-pair">` + sa.map((s, k) =>
              `<p class="il-s-orig">${marked.parseInline(s.trim())}</p>` +
              `<p class="il-s-trans">${marked.parseInline(sb[k].trim())}</p>`
            ).join("") + `</div>`;
            continue;
          }
        }
        if (pa) html += `<div class="il-orig">${marked.parser([pa])}</div>`;
        if (pb && (!pa || differs)) {
          html += `<div class="il-trans">${marked.parser([pb])}</div>`;
        }
      }
      return html;
    }

    function setDocLang(lang) {
      state.docLang = lang;
      localStorage.setItem("docLang", lang);
      return renderDoc({ preserveScroll: true });
    }

    function updateLangbar() {
      const bar = $("#doc-langbar");
      const show = state.view === "collected" && !!state.docPair;
      bar.classList.toggle("hidden", !show);
      if (!show) return;
      bar.querySelectorAll(".seg-btn").forEach((b) => {
        b.setAttribute("aria-selected", b.dataset.lang === state.docLang ? "true" : "false");
      });
    }

    // #
    // home


    function applyView() {
      const home = state.view === "home";
      $("#home-pane").classList.toggle("hidden", !home);
      $("#doc-pane").classList.toggle("hidden", home);
      applyChatSplit();
      updateLangbar();
      updateDownload();
      renderTree();
      renderMessages();
    }

    function openCollected() {
      if (state.currentId && state.nodeById.has(state.currentId)) {
        openFile(state.currentId);
        return;
      }
      state.view = "collected";
      state.currentId = null;
      state.currentPath = null;
      state.currentTitle = null;
      state.currentText = "";
      state.docPair = null;
      applyView();
      $("#doc-content").innerHTML = `
        <div class="doc-in py-24 text-center">
          <p class="text-[21px] font-semibold tracking-tight text-slate-800">Collected</p>
          <p class="mt-2 text-[15px] font-light text-slate-500">Pick a document from Related or List.</p>
        </div>`;
    }

    function openHome() {
      state.view = "home";
      state.currentId = null;
      state.currentPath = null;
      state.currentTitle = null;
      state.currentText = "";
      state.docPair = null;
      const url = new URL(location.href);
      url.searchParams.delete("doc");
      history.replaceState(null, "", url);
      applyView();
      applyHomeMode();
      if (!state.related.length) loadRelated(null);
      setTimeout(() => $("#home-input").focus(), 60);
    }

    function applyHomeMode() {
      const ask = state.homeMode === "ask";
      $("#home-mode-label").textContent = state.homeMode;
      $("#home-mode-menu").querySelectorAll("[data-home-mode]").forEach((b) => {
        b.setAttribute("aria-selected", String(b.dataset.homeMode === state.homeMode));
      });
      $("#home-input").placeholder = ask ? "Ask anything" : "Paste a URL…";
      localStorage.setItem("homeMode", state.homeMode);
    }

    function setHomeModeOpen(open) {
      $("#home-mode-menu").classList.toggle("hidden", !open);
      $("#home-mode-btn").setAttribute("aria-expanded", String(open));
    }

    function setHomeMode(mode) {
      state.homeMode = mode;
      applyHomeMode();
      setHomeModeOpen(false);
      $("#home-input").focus();
    }

    function autoResizeHome() {
      const ta = $("#home-input");
      ta.style.height = "auto";
      ta.style.height = Math.min(240, Math.max(34, ta.scrollHeight)) + "px";
    }

    async function runHome() {
      const box = $("#home-input");
      const value = box.value.trim();
      if (!value || state.sending) return;
      const collecting = state.homeMode === "collect";
      if (collecting && !/^https?:\/\//i.test(value) && !/^\d{4}\.\d{4,5}/.test(value)) {
        toast("Give a URL or an arXiv id");
        return;
      }
      box.value = "";
      autoResizeHome();
      openChat(true);

      state.messages.push({ role: "user", content: value, mode: state.homeMode });
      const assistant = { role: "assistant", content: "", streaming: true };
      state.messages.push(assistant);
      renderMessages();
      setSending(true);

      try {
        const res = await fetch(collecting ? "/api/collect" : "/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collecting ? { input: value } : { question: value }),
        });
        if (!res.ok || !res.body) throw new Error(await res.text());
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let answered = false;
        for (;;) {
          const { value: chunk, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(chunk, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;
            const raw = line.slice(5).trim();
            if (raw === "[DONE]") continue;
            let ev;
            try { ev = JSON.parse(raw); } catch { continue; }
            if (ev.type === "step") {
              assistant.steps = assistant.steps || [];
              const now = performance.now();
              const at = assistant.steps.findIndex((s) => s.key === ev.key);
              if (at >= 0) {
                const was = assistant.steps[at];
                assistant.steps[at] = { ...was, text: ev.text, state: ev.state || "running", took: now - was.at };
              } else {
                assistant.steps.push({ key: ev.key, text: ev.text, state: ev.state || "running", at: now, took: null });
              }
            } else if (ev.type === "terms") {
              assistant.note = `Keywords ${ev.terms.join(", ")}`;
            } else if (ev.type === "hits") {
              assistant.sources = ev.hits;
              state.related = ev.hits;
              renderTree();
            } else if (ev.type === "collected") {
              assistant.sources = [{ id: ev.id, path: ev.path }];
            } else if (ev.type === "delta") {
              if (!answered) { answered = true; assistant.content = ""; }
              assistant.content += ev.text;
            } else if (ev.type === "done") {
              if (ev.text) assistant.content = ev.text;
              if (ev.id) assistant.sources = [{ id: ev.id, path: state.nodeById.get(ev.id)?.path || ev.id }];
            } else if (ev.type === "error") {
              assistant.content = (assistant.content ? assistant.content + "\n\n" : "") + `Error: ${ev.error}`;
            }
            renderMessages();
          }
        }
      } catch (e) {
        assistant.content = `Error: ${e.message || e}`;
      }
      assistant.streaming = false;
      setSending(false);
      renderMessages();
      persistConversation();
      if (collecting) loadTree();
    }

    async function renderDoc(opts = {}) {
      if (state.view !== "collected") return;
      const { preserveScroll = false } = opts;
      const pair = state.docPair;
      const lang = pair ? state.docLang : "orig";
      if (pair && lang !== "orig" && state.pairTexts.trans == null) {
        try {
          state.pairTexts.trans = (await fetchFile(state.currentId, "kor")).content;
        } catch (e) {
          toast("Could not load the translation");
          state.docLang = "orig";
          return renderDoc(opts);
        }
      }
      marked.setOptions({ gfm: true, breaks: false });
      const isMd = /\.(md|markdown|mdx)$/i.test(state.currentPath);
      clearActiveDocSelection();
      let inner;
      if (/\.html?$/i.test(state.currentPath)) {
        const hasKor = !!state.docPair;
        inner = `
          <div class="doc-in text-center py-24">
            <p class="text-[21px] font-semibold tracking-tight text-slate-800 break-all px-6">${escapeHtml(state.currentTitle || "")}</p>
            <p class="mt-2 text-[14px] font-light text-slate-500">An HTML document with its original typesetting. Opens as is in a new tab.</p>
            <div class="mt-6 flex items-center justify-center gap-2">
              <a href="${rawUrl(state.currentId, "eng")}" target="_blank" rel="noopener"
                 class="rounded-full bg-apple px-4 py-1.5 text-sm text-white hover:bg-apple-hover transition duration-150">Open original</a>
              ${hasKor ? `<a href="${rawUrl(state.currentId, "kor")}" target="_blank" rel="noopener"
                 class="rounded-full border border-apple-link px-4 py-1.5 text-sm text-apple-link hover:bg-apple-link/5 transition duration-150">Open Korean</a>` : ""}
            </div>
          </div>`;
      } else if (!isMd) {
        inner = `<pre class="raw-doc doc-in whitespace-pre-wrap font-mono text-slate-800 bg-white rounded-xl p-4">${escapeHtml(state.pairTexts.orig)}</pre>`;
      } else if (lang === "trans") {
        inner = `<div class="prose-doc doc-in">${marked.parse(state.pairTexts.trans)}</div>`;
      } else if (lang === "both") {
        inner = `<div class="prose-doc doc-in">${interleaveMd(state.pairTexts.orig, state.pairTexts.trans)}</div>`;
      } else {
        inner = `<div class="prose-doc doc-in">${marked.parse(state.pairTexts.orig)}</div>`;
      }
      state.currentText = lang === "trans" ? state.pairTexts.trans : state.pairTexts.orig;
      $("#doc-content").innerHTML = sourceLine() + inner;
      updateLangbar();
      updateDownload();
      if (!preserveScroll) $("#doc-scroll").scrollTop = 0;
    }

    async function openFile(id, opts = {}) {
      const { skipIfSame = false, preserveScroll = false } = opts;
      const node = state.nodeById.get(id);
      if (!node) return false;
      if (skipIfSame && state.currentId === id && state.currentText) return true;

      const wasHome = state.view === "home";
      state.view = "collected";
      if (wasHome) applyView();
      state.currentId = id;
      state.currentPath = node.path;
      state.currentTitle = node.name;
      state.docPair = translationOf(id);
      state.docLang = state.docPair ? state.docLang : "orig";
      state.pairTexts = { orig: null, trans: null };

      const url = new URL(location.href);
      url.searchParams.set("doc", id);
      history.replaceState(null, "", url);

      renderTree();
      try {
        const [data, meta] = await Promise.all([fetchFile(id, "eng"), fetchMeta(id)]);
        state.pairTexts.orig = data.content;
        state.currentMeta = meta;
      } catch (e) {
        toast("Could not load the document");
        return false;
      }
      await renderDoc({ preserveScroll });
      updateDownload();
      fetch("/api/opened", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      }).catch(() => {}).finally(() => loadRelated(id));

      return true;
    }

    let scrollSaveTimer = null;

    function saveDocScroll() {
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(() => {
        if (!state.currentPath) return;
        try {
          sessionStorage.setItem("docScroll:" + state.currentPath, String(Math.round($("#doc-scroll").scrollTop)));
        } catch (_) {}
      }, 150);
    }

    function restoreDocScroll(path) {
      let y = 0;
      try {
        y = parseFloat(sessionStorage.getItem("docScroll:" + path) || "0") || 0;
      } catch (_) {}
      if (!y) return;
      const el = $("#doc-scroll");
      let userMoved = false;
      el.addEventListener("wheel", () => (userMoved = true), { once: true, passive: true });
      el.addEventListener("touchstart", () => (userMoved = true), { once: true, passive: true });
      const apply = () => {
        if (!userMoved) el.scrollTop = y;
      };
      requestAnimationFrame(apply);
      $("#doc-content").querySelectorAll("img").forEach((img) => {
        if (!img.complete) img.addEventListener("load", apply, { once: true });
      });
    }

    async function openDocFromUrl() {
      const doc = new URLSearchParams(location.search).get("doc");
      if (doc && state.nodeById.has(doc)) {
        if (await openFile(doc)) restoreDocScroll(doc);
        return;
      }
      openHome();
    }

    function findTextRangeInDoc(needle) {
      const root = $("#doc-content");
      if (!root || !needle) return null;
      const target = String(needle).replace(/\s+/g, " ").trim();
      if (!target) return null;

      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const parts = [];
      let full = "";
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const value = node.nodeValue || "";
        if (!value) continue;
        parts.push({ node, start: full.length, raw: value });
        full += value;
      }
      let norm = "";
      const normToOrig = [];
      let prevSpace = false;
      for (let i = 0; i < full.length; i++) {
        const ch = full[i];
        const isSpace = /\s/.test(ch);
        if (isSpace) {
          if (!prevSpace && norm.length > 0) {
            norm += " ";
            normToOrig.push(i);
          }
          prevSpace = true;
        } else {
          norm += ch;
          normToOrig.push(i);
          prevSpace = false;
        }
      }
      norm = norm.trim();
      let normFull = "";
      const map2 = [];
      prevSpace = true;
      for (let i = 0; i < full.length; i++) {
        const ch = full[i];
        const isSpace = /\s/.test(ch);
        if (isSpace) {
          if (!prevSpace) {
            normFull += " ";
            map2.push(i);
          }
          prevSpace = true;
        } else {
          normFull += ch;
          map2.push(i);
          prevSpace = false;
        }
      }
      const nq = target;
      let idx = normFull.indexOf(nq);
      if (idx < 0 && nq.length > 80) {
        idx = normFull.indexOf(nq.slice(0, 80));
      }
      if (idx < 0) return null;
      const origStart = map2[idx];
      const origEnd = map2[Math.min(idx + nq.length - 1, map2.length - 1)] + 1;
      if (origStart == null || origEnd == null) return null;

      function pointAt(offset) {
        for (const p of parts) {
          const end = p.start + p.raw.length;
          if (offset <= end) {
            return { node: p.node, offset: Math.max(0, offset - p.start) };
          }
        }
        const last = parts[parts.length - 1];
        return last ? { node: last.node, offset: last.raw.length } : null;
      }
      const a = pointAt(origStart);
      const b = pointAt(origEnd);
      if (!a || !b) return null;
      try {
        const range = document.createRange();
        range.setStart(a.node, Math.min(a.offset, a.node.nodeValue.length));
        range.setEnd(b.node, Math.min(b.offset, b.node.nodeValue.length));
        return range;
      } catch (_) {
        return null;
      }
    }

    function scrollRangeIntoDocView(range) {
      if (!range) return;
      try {
        const rect = range.getBoundingClientRect();
        const scroller = $("#doc-scroll");
        if (!scroller) return;
        const sRect = scroller.getBoundingClientRect();
        const delta = rect.top - sRect.top - sRect.height * 0.25;
        scroller.scrollBy({ top: delta, behavior: "smooth" });
      } catch (_) {}
    }

    async function openCitation(path, text) {
      if (!path && !text) return;
      if (path) {
        const ok = await openFile(path, { skipIfSame: true, preserveScroll: true });
        if (!ok) {
          toast("Documents could not be opened");
          return;
        }
      }
      requestAnimationFrame(() => {
        const range = text ? findTextRangeInDoc(text) : null;
        if (range) {
          setActiveDocSelection(range);
          scrollRangeIntoDocView(range);
          toast("Jumped to the quote");
        } else if (path) {
          clearActiveDocSelection();
          toast("Documents opened, but the passage was not found");
        } else {
          toast("The quote has no document");
        }
      });
    }

    function decodeCiteAttr(v) {
      if (!v) return "";
      try {
        return decodeURIComponent(v);
      } catch (_) {
        return v;
      }
    }

    // Selection / Citations
    const supportsCssHighlight =
      typeof CSS !== "undefined" && CSS.highlights && typeof Highlight !== "undefined";

    function unwrapDocSelMarks(root) {
      const scope = root || document;
      scope.querySelectorAll("mark.doc-active-sel").forEach((mark) => {
        const parent = mark.parentNode;
        if (!parent) return;
        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
        parent.removeChild(mark);
        parent.normalize && parent.normalize();
      });
    }

    function clearActiveDocSelection() {
      state.docSelRange = null;
      hideSelBar();
      if (supportsCssHighlight) {
        try {
          CSS.highlights.delete("doc-active-sel");
        } catch (_) {}
      }
      unwrapDocSelMarks($("#doc-content") || document);
    }

    function wrapRangeWithMarks(range) {
      const docRoot = $("#doc-content");
      if (!docRoot || !range || range.collapsed) return;
      try {
        if (range.startContainer === range.endContainer && range.startContainer.nodeType === Node.TEXT_NODE) {
          const mark = document.createElement("mark");
          mark.className = "doc-active-sel";
          range.surroundContents(mark);
          return;
        }
      } catch (_) {
      }
      const walker = document.createTreeWalker(docRoot, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          try {
            return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          } catch (_) {
            return NodeFilter.FILTER_REJECT;
          }
        },
      });
      const texts = [];
      while (walker.nextNode()) texts.push(walker.currentNode);
      for (const textNode of texts) {
        let start = 0;
        let end = textNode.nodeValue.length;
        if (textNode === range.startContainer) start = range.startOffset;
        if (textNode === range.endContainer) end = range.endOffset;
        if (start >= end) continue;
        const sub = document.createRange();
        sub.setStart(textNode, start);
        sub.setEnd(textNode, end);
        try {
          const mark = document.createElement("mark");
          mark.className = "doc-active-sel";
          sub.surroundContents(mark);
        } catch (_) {
        }
      }
    }

    function setActiveDocSelection(range) {
      clearActiveDocSelection();
      if (!range || range.collapsed) return;
      const docRoot = $("#doc-content");
      if (!docRoot) return;
      const common = range.commonAncestorContainer;
      if (!docRoot.contains(common.nodeType === Node.ELEMENT_NODE ? common : common.parentNode)) return;

      state.docSelRange = range.cloneRange();
      if (supportsCssHighlight) {
        try {
          CSS.highlights.set("doc-active-sel", new Highlight(state.docSelRange));
          return;
        } catch (_) {
        }
      }
      wrapRangeWithMarks(state.docSelRange.cloneRange());
    }

    function onDocMouseUp(e) {
      const sel = window.getSelection();
      const text = (sel && sel.toString() || "").trim();
      if (!state.currentPath) return;

      if (!text || !sel || !sel.rangeCount) return;
      const anchor = sel.anchorNode;
      if (!anchor || !$("#doc-content").contains(anchor)) return;
      if (text.length < 2) return;

      const range = sel.getRangeAt(0).cloneRange();
      state.lastSelection = text;
      state.pendingSel = { text, range, multi: !!e.shiftKey };
      showSelBar(range);
    }

    function showSelBar(range) {
      const bar = $("#sel-bar");
      bar.classList.remove("hidden");
      bar.classList.add("flex");
      const r = range.getClientRects()[0] || range.getBoundingClientRect();
      const w = bar.offsetWidth;
      const h = bar.offsetHeight;
      const left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
      const top = Math.max(8, r.top - h - 4);
      bar.style.left = left + "px";
      bar.style.top = top + "px";
    }

    function hideSelBar() {
      const bar = $("#sel-bar");
      bar.classList.add("hidden");
      bar.classList.remove("flex");
      state.pendingSel = null;
    }

    function citePendingSel() {
      const p = state.pendingSel;
      if (!p) return;
      setActiveDocSelection(p.range);
      try {
        window.getSelection().removeAllRanges();
      } catch (_) {}
      hideSelBar();
      addCitation(p.text, p.multi);
    }

    async function copyPendingSel() {
      const p = state.pendingSel;
      if (!p) return;
      try {
        await navigator.clipboard.writeText(p.text);
      } catch (_) {
        document.execCommand("copy");
      }
      hideSelBar();
      toast("Copied");
    }

    function addCitation(text, multi) {
      const item = { id: uid(), text, path: state.currentPath || "" };
      if (multi) {
        if (!state.citations.some((c) => c.text === text && c.path === item.path)) {
          state.citations.push(item);
        }
      } else {
        state.citations = [item];
      }
      renderCitations();
      if (!state.chatOpen) openChat(true);
      toast(multi ? "Quote added" : "Quoted");
    }

    function renderCitations() {
      const box = $("#citations");
      if (!state.citations.length) {
        box.classList.add("hidden");
        box.innerHTML = "";
        clearActiveDocSelection();
        return;
      }
      box.classList.remove("hidden");
      box.innerHTML = state.citations
        .map(
          (c, i) => `
        <div class="flex items-start gap-1 rounded-xl bg-slate-50 text-[11px] text-slate-800 overflow-hidden">
          <button
            type="button"
            class="cite-open min-w-0 flex-1 flex items-start gap-2 px-2.5 py-1.5 hover:bg-slate-50"
            title="Open the original document"
            data-cite-path="${encodeURIComponent(c.path || "")}"
            data-cite-text="${encodeURIComponent(c.text || "")}"
          >
            <span class="shrink-0 font-mono font-semibold text-slate-600">#${i + 1}</span>
            <div class="min-w-0 flex-1">
              <div class="font-mono text-[10px] text-slate-500 truncate">${escapeHtml(c.path)}</div>
              <div class="line-clamp-2 font-medium text-slate-800">${escapeHtml(c.text)}</div>
            </div>
          </button>
          <button type="button" data-cid="${c.id}" class="cite-remove icon-btn shrink-0 m-1" title="Remove quote">

    // Chat split layout
    function applyChatSplit() {
      const panel = $("#chat-panel");
      const resizer = $("#split-resizer");
      const navBtn = $("#btn-toggle-chat");
      if (state.view === "home") {
        panel.style.display = "none";
        resizer.style.display = "none";
        if (navBtn) {
          navBtn.classList.add("text-apple");
          navBtn.disabled = true;
          navBtn.title = "Home is the chat";
        }
        return;
      }
      if (navBtn) {
        navBtn.disabled = false;
        navBtn.title = "Toggle chat (⌘N)";
      }
      if (state.chatOpen) {
        panel.classList.remove("hidden");
        panel.style.display = "flex";
        panel.style.width = state.chatWidthPct + "%";
        resizer.classList.remove("hidden");
        resizer.style.display = "";
      } else {
        panel.style.display = "none";
        resizer.style.display = "none";
      }
      if (navBtn) navBtn.classList.toggle("text-apple", state.chatOpen);
      localStorage.setItem("chatOpen", state.chatOpen ? "1" : "0");
      localStorage.setItem("chatWidthPct", String(state.chatWidthPct));

    function openChat(open) {
      const was = state.chatOpen;
      state.chatOpen = open !== undefined ? open : !state.chatOpen;
      applyChatSplit();
      if (state.chatOpen && !was) {
        const panel = $("#chat-panel");
        panel.classList.remove("chat-in");
        void panel.offsetWidth;
        panel.classList.add("chat-in");
        panel.addEventListener("animationend", () => panel.classList.remove("chat-in"), { once: true });
      }

    function initSidebarResizer() {
      const rz = $("#sidebar-resizer");
      const onMove = (e) => {
        if (!state.resizingSidebar) return;
        state.sidebarWidth = clampSidebar(e.clientX - $("#sidebar").getBoundingClientRect().left);
        applySidebar();
      };
      const onUp = () => {
        if (!state.resizingSidebar) return;
        state.resizingSidebar = false;
        $("#sidebar").style.transition = "";
        document.body.classList.remove("cursor-col-resize");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      rz.addEventListener("mousedown", (e) => {
        e.preventDefault();
        state.resizingSidebar = true;
        $("#sidebar").style.transition = "none";
        document.body.classList.add("cursor-col-resize");
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
      rz.addEventListener("dblclick", () => {
        state.sidebarWidth = 288;
        applySidebar();
      });
    }

    function initSplitResizer() {
      const resizer = $("#split-resizer");
      const workspace = $("#workspace");
      let startX = 0;
      let startPct = 50;

      const onMove = (e) => {
        if (!state.resizingSplit) return;
        const rect = workspace.getBoundingClientRect();
        if (rect.width <= 0) return;
        const dx = e.clientX - startX;
        const deltaPct = (dx / rect.width) * 100;
        state.chatWidthPct = clampChatWidth(startPct - deltaPct);
        applyChatSplit();
      };
      const onUp = () => {
        if (!state.resizingSplit) return;
        state.resizingSplit = false;
        document.body.classList.remove("cursor-col-resize");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };

      resizer.addEventListener("mousedown", (e) => {
        if (!state.chatOpen) return;
        e.preventDefault();
        state.resizingSplit = true;
        startX = e.clientX;
        startPct = state.chatWidthPct;
        document.body.classList.add("cursor-col-resize");
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });

      resizer.addEventListener("dblclick", () => {
        state.chatWidthPct = 50;
        applyChatSplit();
      });
    }

    const STEP_MARK = {
      running: `<span class="breathe block h-[7px] w-[7px] rounded-full bg-apple"></span>`,
      done: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="h-[11px] w-[11px] text-slate-400"><path d="M4 12.5l5 5L20 6.5" /></svg>`,
      skip: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="h-[11px] w-[11px] text-slate-300"><path d="M5 12h14" /></svg>`,
      error: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="h-[11px] w-[11px] text-red-500"><path d="M6 6l12 12" /><path d="M18 6L6 18" /></svg>`,
    };

    function stepDuration(took) {
      if (took == null || took < 1000) return "";
      return `${(took / 1000).toFixed(1)}s`;
    }

    function stepsHtml(steps) {
      return `<div class="mb-2">${steps.map((s, i) => {
        const last = i === steps.length - 1;
        const tone = s.state === "skip" ? "text-slate-400" : s.state === "running" ? "" : "text-slate-500";
        return `
        <div class="step-in relative flex gap-2.5 ${last ? "" : "pb-2.5"}">
          ${last ? "" : `<span class="absolute left-[5px] top-[15px] bottom-0 w-px bg-slate-200"></span>`}
          <span class="relative z-10 mt-[4px] flex h-[11px] w-[11px] shrink-0 items-center justify-center rounded-full bg-white">${STEP_MARK[s.state] || STEP_MARK.running}</span>
          <span class="min-w-0 flex-1 text-[12px] ${tone} ${s.state === "running" ? "sweep" : ""}">${escapeHtml(s.text)}</span>
          <span class="shrink-0 pt-px font-mono text-[10px] tabular-nums text-slate-300">${stepDuration(s.took)}</span>
        </div>`;
      }).join("")}</div>`;
    }

    function renderChatMarkdown(src) {
      marked.setOptions({ gfm: true, breaks: true });
      let html = "";
      try {
        html = marked.parse(src || "");
      } catch (_) {
        html = `<p>${escapeHtml(src || "")}</p>`;
      }
      const wrap = document.createElement("div");
      wrap.innerHTML = html;
      wrap.querySelectorAll("table").forEach((table) => {
        if (table.parentElement && table.parentElement.classList.contains("md-table-wrap")) return;
        const scroller = document.createElement("div");
        scroller.className = "md-table-wrap";
        table.parentNode.insertBefore(scroller, table);
        scroller.appendChild(table);
      });
      wrap.querySelectorAll("p").forEach((p) => {
        if (!p.textContent.trim() && !p.querySelector("img,br")) p.remove();
      });
      return wrap.innerHTML;
    }
