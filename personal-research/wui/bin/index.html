    async function persistConversation() {
      if (!state.conversation) return;
      const title =
        state.conversation.title && state.conversation.title !== "New chat"
          ? state.conversation.title
          : (state.messages.find((m) => m.role === "user")?.content || "New chat").slice(0, 48);
      const payload = {
        id: state.conversation.id,
        title,
        createdAt: state.conversation.createdAt,
        messages: state.messages.map((m) => ({
          role: m.role,
          content: m.content,
          citations: m.citations || undefined,
        })),
      };
      const res = await fetch("/api/conversations/" + encodeURIComponent(payload.id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        state.conversation = await res.json();
        $("#chat-sub").textContent = state.conversation.title;
      }
    }

    function setSending(on) {
      state.sending = !!on;
      const btn = $("#btn-send");
      const input = $("#input");
      if (btn) btn.disabled = state.sending;
      if (input) input.disabled = state.sending;
    }

    async function sendChat() {
      const text = $("#input").value.trim();
      if (!text || state.sending) return;
      const cites = state.citations.slice();
      const userMsg = { role: "user", content: text, citations: cites.length ? cites : undefined };
      state.messages.push(userMsg);
      $("#input").value = "";
      autoResizeInput();
      state.citations = [];
      renderCitations();
      renderMessages();

      setSending(true);
      const assistant = { role: "assistant", content: "", streaming: true };
      state.messages.push(assistant);
      renderMessages();

      let finished = false;
      const finishUnlock = () => {
        if (finished) return;
        finished = true;
        assistant.streaming = false;
        setSending(false);
      };

      try {
        const history = state.messages
          .filter((m) => m !== assistant && (m.role === "user" || m.role === "assistant"))
          .map((m) => ({
            role: m.role,
            content: m.content,
            citations: m.citations,
          }));

        const controller = new AbortController();
        const hangTimer = setTimeout(() => controller.abort(), 180_000);

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: buildSystemPrompt(),
            path: state.currentPath || "",
            document: state.currentText || "",
            messages: history,
            max_turns: 1,
          }),
          signal: controller.signal,
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err.slice(0, 500));
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let streamDone = false;
        while (!streamDone) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            const line = chunk.trim();
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (data === "[DONE]") {
              streamDone = true;
              break;
            }
            try {
              const j = JSON.parse(data);
              if (j.type === "delta" && j.text) {
                assistant.content += j.text;
                renderMessages();
              } else if (j.type === "done") {
                if (j.text && !assistant.content) assistant.content = j.text;
                if (j.text && assistant.content && j.text.length > assistant.content.length) {
                  assistant.content = j.text;
                }
                renderMessages();
                finishUnlock();
                streamDone = true;
                try { reader.cancel(); } catch (_) {}
                break;
              } else if (j.type === "error") {
                assistant.content = (assistant.content ? assistant.content + "\n\n" : "") + "Error: " + (j.error || "") + (j.stderr ? "\n" + j.stderr : "");
                renderMessages();
                finishUnlock();
                streamDone = true;
                try { reader.cancel(); } catch (_) {}
                break;
              }
            } catch (_) {}
          }
        }
        clearTimeout(hangTimer);
        if (!assistant.content) assistant.content = "(no response)";
      } catch (e) {
        const msg = e && e.name === "AbortError" ? "The response timed out" : e.message;
        assistant.content = (assistant.content ? assistant.content + "\n\n" : "") + "Error: " + msg;
      } finally {
        finishUnlock();
        renderMessages();
        await persistConversation();
      }
    }

    function saveBlob(text, name) {

    function buildBilingualMd(orig, trans) {
      const strip = (t) => marked.lexer(t || "").filter((x) => x.type !== "space");
      const a = strip(orig), b = strip(trans);
      const out = [];
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const pa = a[i], pb = b[i];
        const same = pa && pb && pa.raw.trim() === pb.raw.trim();
        if (pa && pb && !same && pa.type === "paragraph" && pb.type === "paragraph") {
          const sa = splitSentences(pa.raw.trim()), sb = splitSentences(pb.raw.trim());
          if (sa.length === sb.length) {
            out.push(sa.map((x, k) => x.trim() + "\n" + sb[k].trim()).join("\n\n"));
            continue;
          }
        }
        if (pa) out.push(pa.raw.trim());
        if (pb && !same) out.push(pb.raw.trim());
      }
      return out.join("\n\n") + "\n";
    }

    function printDoc(win) {

      const css = [...document.querySelectorAll("style")]

      const zoom = getComputedStyle($("#doc-content")).getPropertyValue("--doc-zoom").trim() || "1";
      const body = $("#doc-content").innerHTML.replace(/\bdoc-in\b/g, "");
      win.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${escapeHtml(name)}</title>
<style>${css}</style>
<style>
  html, body { height: auto; overflow: visible; background: #fff; margin: 0; }
  .doc-print { font-size: calc(15px * ${zoom}); letter-spacing: -0.016em; padding: 14mm 0; }
  @page { margin: 0 18mm; }
  @media print {
    .prose-doc a { color: #0066cc !important; text-decoration: none !important; }
    .prose-doc h1, .prose-doc h2, .prose-doc h3 { break-after: avoid; }
    .prose-doc pre, .prose-doc table, .prose-doc img, .prose-doc blockquote, .il-pair { break-inside: avoid; }
    .prose-doc pre { white-space: pre-wrap; word-break: break-word; overflow: visible; }
  }
</style></head><body class="font-sans antialiased bg-white text-slate-900"><article class="doc-print">${body}</article></body></html>`);
      win.document.close();
      toast("In the print dialog, set the destination to 'PDFSave as'");
      const go = () => {
        win.focus();
        win.print();
      };
      if (win.document.readyState === "complete") setTimeout(go, 120);
      else win.addEventListener("load", go);
    }

    async function runDownload() {
      const { dlLang: lang, dlFmt: fmt, docPair: pair } = state;
      if (!state.currentPath) return;
      setDownloadOpen(false);

      if (fmt === "pdf") {
        const win = window.open("", "_blank");
        if (!win) return toast("Could not open the print window. Allow pop-ups.");
        if (pair && state.docLang !== lang) await setDocLang(lang);
        return printDoc(win);
      }
      if (lang === "both" && pair) {
        try {
          if (state.pairTexts.trans == null) {
            state.pairTexts.trans = (await fetchFile(state.currentId, "kor")).content;
          }
        } catch (e) {
          return toast("Could not load the translation");
        }
        const base = state.currentPath.split("/").pop().replace(/\.[^.]+$/, "");
        saveBlob(buildBilingualMd(state.pairTexts.orig, state.pairTexts.trans), base + "-bilingual.md");
        return toast(base + "-bilingual.md downloaded");
      }
      const name = state.currentPath.split("/").pop();
      triggerSave(rawUrl(state.currentId, lang === "trans" && pair ? "kor" : "eng"), name);
      toast(name + " downloaded");
    }

    // History dropdown
    function isHistoryOpen() {
      return !$("#history-dropdown").classList.contains("hidden");
    }

    function setHistoryOpen(open) {
      const dd = $("#history-dropdown");
      const btn = $("#btn-history");
      const chev = $("#history-chevron");
      if (open) {
        dd.classList.remove("hidden");
        btn.setAttribute("aria-expanded", "true");
        btn.classList.add("bg-slate-50");
        if (chev) chev.classList.add("rotate-180");
      } else {
        dd.classList.add("hidden");
        btn.setAttribute("aria-expanded", "false");
        btn.classList.remove("bg-slate-50");
        if (chev) chev.classList.remove("rotate-180");
      }
    }

    function formatHistoryTime(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mi = String(d.getMinutes()).padStart(2, "0");
        return `${mm}/${dd} ${hh}:${mi}`;
      } catch (_) {
        return iso;
      }
    }

    async function refreshHistoryList() {
      const list = $("#history-list");
      list.innerHTML = `<div class="px-3 py-4 text-center text-xs text-slate-400">Loading…</div>`;
      try {
        const res = await fetch("/api/conversations");
        const data = await res.json();
        const items = data.items || [];
        const currentId = state.conversation && state.conversation.id;
        if (!items.length) {
          list.innerHTML = `<div class="px-3 py-5 text-center text-xs text-slate-400">No saved chats</div>`;
          return;
        }
        list.innerHTML = items
          .map((it) => {
            const active = it.id === currentId;
            return `
            <div
              role="option"
              aria-selected="${active ? "true" : "false"}"
              data-id="${escapeHtml(it.id)}"
              class="group flex items-center gap-1 px-1.5 py-0.5 ${active ? "bg-slate-100" : ""}"
            >
              <button
                type="button"
                data-open="${escapeHtml(it.id)}"
                class="min-w-0 flex-1 rounded-lg px-2 py-1.5 text-left hover:bg-slate-50 transition duration-150 ${active ? "hover:bg-slate-100" : ""}"
              >
                <div class="text-[13px] font-medium text-slate-900 truncate">${escapeHtml(it.title || "Untitled")}</div>
                <div class="text-[10px] text-slate-400 tabular-nums">${escapeHtml(formatHistoryTime(it.updatedAt))} · messages ${it.messageCount || 0}</div>
              </button>
              <button
                type="button"
                data-del="${escapeHtml(it.id)}"
                title="Delete"
                class="icon-btn shrink-0"
              ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-3 w-3 pointer-events-none"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
            </div>`;
          })
          .join("");

        list.querySelectorAll("[data-open]").forEach((btn) => {
          btn.addEventListener("click", () => {
            loadConversation(btn.dataset.open);
            setHistoryOpen(false);
          });
        });
        list.querySelectorAll("[data-del]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const id = btn.dataset.del;
            await fetch("/api/conversations/" + encodeURIComponent(id), { method: "DELETE" });
            if (state.conversation && state.conversation.id === id) {
              newConversation();
              toast("Chat deleted");
            }
            await refreshHistoryList();
          });
        });
      } catch (e) {
        list.innerHTML = `<div class="px-3 py-4 text-center text-xs text-red-500">Could not load the list</div>`;
      }
    }

    async function toggleHistory() {
      if (isHistoryOpen()) {
        setHistoryOpen(false);
        return;
      }
      setHistoryOpen(true);
      await refreshHistoryList();
    }

    async function loadConversation(id) {
      const res = await fetch("/api/conversations/" + encodeURIComponent(id));
      if (!res.ok) return toast("Could not open the chat");
      const data = await res.json();
      state.conversation = data;
      state.messages = (data.messages || []).map((m) => ({ ...m }));
      state.citations = [];
      renderCitations();
      renderMessages();
      $("#chat-sub").textContent = data.title || "chats";
      setHistoryOpen(false);
      openChat(true);
    }

    // Events
    $("#btn-toggle-sidebar").addEventListener("click", () => {
      state.sidebarOpen = !state.sidebarOpen;
      applySidebar();
    });
    $("#sidebar-scrim").addEventListener("click", () => {
      state.sidebarOpen = false;
      applySidebar();
    });
    $("#btn-toggle-chat").addEventListener("click", () => openChat());
    $("#btn-new-chat").addEventListener("click", () => {
      newConversation();
      setHistoryOpen(false);
      toast("Started a new chat");
    });
    $("#btn-history").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleHistory();
    });
    document.addEventListener("click", (e) => {
      const root = $("#history-dd");
      if (root && !root.contains(e.target) && isHistoryOpen()) {
        setHistoryOpen(false);
      }
      const dd = $("#download-dd");
      if (dd && !dd.contains(e.target) && isDownloadOpen()) {
        setDownloadOpen(false);
      }
    });
    $("#doc-scroll").addEventListener("mouseup", onDocMouseUp);
    $("#doc-scroll").addEventListener("scroll", hideSelBar, { passive: true });
    $("#doc-scroll").addEventListener("scroll", saveDocScroll, { passive: true });
    $("#sel-bar").addEventListener("mousedown", (e) => e.preventDefault());
    $("#sel-chat").addEventListener("click", citePendingSel);
    $("#sel-copy").addEventListener("click", copyPendingSel);
    document.addEventListener("mousedown", (e) => {
      if (!$("#sel-bar").contains(e.target)) hideSelBar();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideSelBar();
    });
    $("#doc-langbar").querySelectorAll(".seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => setDocLang(btn.dataset.lang));
    });
    function autoResizeInput() {
      const ta = $("#input");
      if (!ta) return;
      ta.style.height = "auto";
      const next = Math.min(144, Math.max(48, ta.scrollHeight));
      ta.style.height = next + "px";
    }
    $("#home-send").addEventListener("click", runHome);
    $("#home-input").addEventListener("input", autoResizeHome);
    $("#home-input").addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        setHomeMode(state.homeMode === "ask" ? "collect" : "ask");
        return;
      }
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        runHome();
      }
    });
    $("#home-mode-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      setHomeModeOpen($("#home-mode-menu").classList.contains("hidden"));
    });
    $("#home-mode-menu").querySelectorAll("[data-home-mode]").forEach((b) => {
      b.addEventListener("click", () => setHomeMode(b.dataset.homeMode));
    });
    document.addEventListener("click", (e) => {
      if (!$("#home-mode").contains(e.target)) setHomeModeOpen(false);
    });
    $("#btn-send").addEventListener("click", sendChat);
    $("#input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });
    $("#input").addEventListener("input", autoResizeInput);
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "n" || e.key === "N")) {
        e.preventDefault();
        if (!state.chatOpen) openChat(true);
        else openChat(false);
      }
      // Font size
      if ((e.metaKey || e.ctrlKey) && (e.key === "=" || e.key === "+" || e.key === "Equal")) {
        e.preventDefault();
        setDocZoom(state.docZoom + 0.1);
      }
      if ((e.metaKey || e.ctrlKey) && (e.key === "-" || e.key === "Minus")) {
        e.preventDefault();
        setDocZoom(state.docZoom - 0.1);
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "0") {
        e.preventDefault();
        setDocZoom(1);
      }
      if (e.key === "Escape") {
        if (!$("#settings-modal").classList.contains("hidden")) {
          closeSettings();
          return;
        }
        if (isDownloadOpen()) {
          setDownloadOpen(false);
          return;
        }
        if (isHistoryOpen()) {
          setHistoryOpen(false);
          return;
        }
        if (state.chatOpen) openChat(false);
      }
    });
    $("#btn-doc-font-down").addEventListener("click", () => setDocZoom(state.docZoom - 0.1));
    $("#btn-doc-font-up").addEventListener("click", () => setDocZoom(state.docZoom + 0.1));
    $("#btn-doc-font-reset").addEventListener("click", () => setDocZoom(1));
    $("#btn-chat-font-down").addEventListener("click", () => setChatZoom(state.chatZoom - 0.1));
    $("#btn-chat-font-up").addEventListener("click", () => setChatZoom(state.chatZoom + 0.1));
    $("#btn-chat-font-reset").addEventListener("click", () => setChatZoom(1));
    $("#btn-download").addEventListener("click", (e) => {
      e.stopPropagation();
      setDownloadOpen(!isDownloadOpen());
    });
    $("#dl-langs").querySelectorAll("[data-dl-lang]").forEach((b) => {
      b.addEventListener("click", () => {
        state.dlLang = b.dataset.dlLang;
        renderDownloadChoices();
      });
    });
    $("#dl-fmts").querySelectorAll("[data-dl-fmt]").forEach((b) => {
      b.addEventListener("click", () => {
        state.dlFmt = b.dataset.dlFmt;
        localStorage.setItem("dlFmt", state.dlFmt);
        renderDownloadChoices();
      });
    });
    $("#dl-go").addEventListener("click", runDownload);
    $("#btn-settings").addEventListener("click", openSettings);
    $("#btn-close-settings").addEventListener("click", closeSettings);
    $("#btn-cancel-settings").addEventListener("click", closeSettings);
    $("#settings-modal").addEventListener("click", (e) => {
      if (e.target === $("#settings-modal")) closeSettings();
    });
    $("#btn-save-settings").addEventListener("click", () => {
      closeSettings();
      toast("Settings saved");
    });

    // init
    if (window.matchMedia("(max-width: 767px)").matches) {
      state.sidebarOpen = false;
      state.chatOpen = false;
    }
    applySidebar();
    applyView();
    applyHomeMode();
    autoResizeHome();
    updateDownload();
    applyDocZoom();
    applyChatZoom();
    applyChatSplit();
    initSidebarResizer();
    initSplitResizer();
    newConversation();
    loadTree().then(openDocFromUrl, (e) => {
      $("#tree").innerHTML = `<div class="p-3 text-xs text-slate-600">Could not load the document list. <code class="bg-slate-100 px-1 rounded">python3 server.py</code> Check that the server is running.<br/>${escapeHtml(e.message)}</div>`;
    });
  </script>
</body>
</html>
