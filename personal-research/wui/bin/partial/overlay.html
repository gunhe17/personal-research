  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 enter-fade">
    <div class="w-full max-w-md max-h-[90vh] flex flex-col rounded-3xl bg-white shadow-2xl overflow-hidden enter-rise">
      <div class="shrink-0 flex items-center gap-2 px-5 pt-5 pb-3">
        <h3 class="text-sm font-semibold text-slate-900 flex-1">Settings</h3>
        <button type="button" id="btn-close-settings" class="icon-btn shrink-0" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-4 w-4"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-5">
        <!-- Model access -->
        <section>
          <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Model access</h4>
          <p class="text-[11px] text-slate-400 mb-3">Plan login uses the CLI's own sign-in. API key bills the provider account.</p>
          <div id="settings-providers" class="space-y-4"></div>
          <p id="settings-error" class="mt-2 text-[12px] text-red-600" hidden></p>
        </section>

        <!-- Document font size -->
        <section>
          <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Document text size</h4>
          <p class="text-[11px] text-slate-400 mb-2">Document viewer · ⌘+ / ⌘− / ⌘0</p>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-doc-font-down" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Smaller document text">A−</button>
            <span id="doc-font-label" class="min-w-[3.5rem] text-center font-mono text-sm font-semibold text-slate-800 tabular-nums">100%</span>
            <button type="button" id="btn-doc-font-up" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Larger document text">A+</button>
            <button type="button" id="btn-doc-font-reset" class="ml-1 rounded-full border border-slate-200 px-3 h-9 text-[11px] font-medium text-slate-600 hover:bg-slate-50" aria-label="Default document size">Default</button>
          </div>
        </section>

        <!-- Chat font size -->
        <section>
          <h4 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">Chat text size</h4>
          <p class="text-[11px] text-slate-400 mb-2">messages, composer and quotes</p>
          <div class="flex items-center gap-2">
            <button type="button" id="btn-chat-font-down" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Smaller chat text">A−</button>
            <span id="chat-font-label" class="min-w-[3.5rem] text-center font-mono text-sm font-semibold text-slate-800 tabular-nums">100%</span>
            <button type="button" id="btn-chat-font-up" class="h-9 w-9 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-sm" aria-label="Larger chat text">A+</button>
            <button type="button" id="btn-chat-font-reset" class="ml-1 rounded-full border border-slate-200 px-3 h-9 text-[11px] font-medium text-slate-600 hover:bg-slate-50" aria-label="Default chat size">Default</button>
          </div>
        </section>
      </div>
      <div class="shrink-0 flex justify-end gap-2 px-5 py-3 bg-slate-50/80">
        <button type="button" id="btn-cancel-settings" class="rounded-full border border-slate-200 px-4 py-1.5 text-sm font-normal text-slate-700 hover:bg-slate-50 transition duration-150">Cancel</button>
        <button type="button" id="btn-save-settings" class="rounded-full bg-apple px-4 py-1.5 text-sm font-normal text-white hover:bg-apple-hover">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] -translate-x-1/2 translate-y-1 rounded-full bg-white px-4 py-2 text-sm text-slate-800 shadow-lg opacity-0 transition-all duration-[280ms] ease-spring"></div>
  <div id="sel-bar" class="hidden fixed z-[55] items-center gap-0.5 rounded-full border border-slate-200 bg-white p-0.5">
    <button type="button" id="sel-chat" title="Quote in chat (hold ⇧ while selecting to append)" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z" />
      </svg>
    </button>
    <button type="button" id="sel-copy" title="Copy" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <path d="M5 15V6a2 2 0 0 1 2-2h8" />
      </svg>
    </button>
  </div>
