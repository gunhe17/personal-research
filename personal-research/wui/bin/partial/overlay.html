  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 enter-fade">
    <div class="relative flex h-[min(560px,90vh)] w-full max-w-2xl overflow-hidden rounded-2xl bg-white enter-rise">
      <!-- nav -->
      <nav class="flex w-48 shrink-0 flex-col border-r border-slate-100 bg-white px-2 pb-2 pt-3 max-sm:w-36">
        <div class="mb-2 px-2 text-sm font-semibold text-slate-900">Settings</div>
        <button type="button" data-settings-tab="general" class="mb-0.5 flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm text-slate-600 transition duration-150 hover:bg-slate-50 aria-selected:bg-apple aria-selected:font-medium aria-selected:text-white aria-selected:hover:bg-apple"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><circle cx="12" cy="12" r="3" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" /></svg><span class="min-w-0 flex-1 truncate">General</span></button>
        <div class="flex items-center gap-2 px-2 py-1.5 text-sm text-slate-600"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M9 9h6v6H9z" /><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2" /></svg><span>Models</span></div>
        <div id="settings-provider-tabs" class="ml-3 mt-0.5 flex flex-col gap-0.5 border-l border-slate-100 pl-1"></div>
      </nav>

      <!-- pane -->
      <div class="min-w-0 flex-1 overflow-y-auto p-6">
        <button type="button" id="btn-close-settings" class="icon-btn absolute right-3 top-3" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-4 w-4"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <div data-settings-pane="general" class="space-y-6">
          <h3 class="text-[21px] font-semibold tracking-tight text-slate-900">General</h3>
          <section>
            <h4 class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-500">Document text size</h4>
            <div class="flex items-center gap-2">
              <button type="button" id="btn-doc-font-down" class="h-8 w-8 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-[13px]" aria-label="Smaller document text">A−</button>
              <span id="doc-font-label" class="min-w-[3.25rem] text-center font-mono text-[13px] font-semibold text-slate-800 tabular-nums">100%</span>
              <button type="button" id="btn-doc-font-up" class="h-8 w-8 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-[13px]" aria-label="Larger document text">A+</button>
              <button type="button" id="btn-doc-font-reset" class="ml-1 rounded-full bg-slate-100 px-3 h-8 text-[12px] text-slate-700 hover:bg-slate-200" aria-label="Default document size">Default</button>
            </div>
          </section>
          <section>
            <h4 class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-500">Chat text size</h4>
            <div class="flex items-center gap-2">
              <button type="button" id="btn-chat-font-down" class="h-8 w-8 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-[13px]" aria-label="Smaller chat text">A−</button>
              <span id="chat-font-label" class="min-w-[3.25rem] text-center font-mono text-[13px] font-semibold text-slate-800 tabular-nums">100%</span>
              <button type="button" id="btn-chat-font-up" class="h-8 w-8 rounded-full border border-slate-200 text-slate-800 hover:bg-slate-50 font-semibold text-[13px]" aria-label="Larger chat text">A+</button>
              <button type="button" id="btn-chat-font-reset" class="ml-1 rounded-full bg-slate-100 px-3 h-8 text-[12px] text-slate-700 hover:bg-slate-200" aria-label="Default chat size">Default</button>
            </div>
          </section>
        </div>
        <div id="settings-provider-panes"></div>
      </div>

      <!-- sheet -->
      <div id="login-sheet" class="absolute inset-0 z-10 hidden items-start justify-center bg-white/60 p-6 pt-16 backdrop-blur-[2px]">
        <div class="w-full max-w-sm overflow-hidden rounded-2xl bg-white ring-1 ring-slate-200 enter-rise">
          <div class="flex items-center border-b border-slate-100 px-5 py-4">
            <h3 id="login-title" class="flex-1 text-sm font-semibold text-slate-900">Log in</h3>
            <button type="button" id="login-cancel" class="text-[12px] text-slate-500 hover:text-slate-800">Cancel</button>
          </div>
          <ol class="space-y-5 p-5 text-[13px] text-slate-800">
            <li class="flex gap-3">
              <span data-step="1" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[12px]">1</span>
              <div class="min-w-0"><div class="font-medium">Open the login page</div><a id="login-url" target="_blank" rel="noopener noreferrer" class="mt-1 inline-block max-w-full truncate text-[#0066cc] hover:underline"></a></div>
            </li>
            <li class="flex gap-3">
              <span data-step="2" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[12px]">2</span>
              <div class="min-w-0 flex-1">
                <div id="login-step-two" class="font-medium">Enter this code</div>
                <div id="login-code-row" class="mt-2 hidden items-center gap-2">
                  <span id="login-code" class="select-all rounded-lg bg-slate-50 px-3 py-2 font-mono text-[20px] font-semibold tracking-[0.12em] text-slate-900"></span>
                  <button type="button" id="login-copy" class="rounded-full bg-slate-100 px-3 py-1 text-[12px] text-slate-700 hover:bg-slate-200">Copy</button>
                </div>
                <div id="login-paste-row" class="mt-2 hidden gap-2">
                  <input id="login-paste" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the code" class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-1.5 text-[13px] text-slate-900 placeholder:text-slate-400 focus:border-apple focus:bg-white focus:outline-none" />
                  <button type="button" id="login-submit" class="shrink-0 rounded-full bg-apple px-3 py-1 text-[12px] text-white hover:bg-apple-hover disabled:opacity-40">Submit</button>
                </div>
              </div>
            </li>
            <li class="flex gap-3">
              <span data-step="3" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[12px]">3</span>
              <div><div id="login-wait" class="font-medium">Waiting for approval…</div><div id="login-hint" class="mt-1 text-[12px] text-slate-400"></div></div>
            </li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] -translate-x-1/2 translate-y-1 rounded-full bg-white px-4 py-2 text-sm text-slate-800 shadow-lg opacity-0 transition-all duration-[280ms] ease-spring"></div>
  <div id="sel-bar" class="hidden fixed z-[55] items-center gap-0.5 rounded-full border border-slate-200 bg-white p-0.5">
    <button type="button" id="sel-chat" title="Quote in chat (hold ⇧ while selecting to append)" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z" />
      </svg>
    </button>
    <button type="button" id="sel-copy" title="Copy" class="icon-btn rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-[16px] w-[16px]">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <path d="M5 15V6a2 2 0 0 1 2-2h8" />
      </svg>
    </button>
  </div>
