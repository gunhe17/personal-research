      <!-- Chat panel -->
      <aside
        id="chat-panel"
        class="relative h-full flex-1 flex flex-col min-w-0 bg-white overflow-hidden select-text"
      >
        <div id="space-scroll" class="relative flex-1 min-h-0 overflow-y-auto overflow-x-hidden bg-slate-50">
          <div id="space-banner" class="space-banner" role="alert" hidden></div>
          <div id="space-empty" class="space-empty">
            <p class="title">이 space 에서 무엇을 배울까요?</p>
            <p>질문하면 수집물을 먼저 조사해 근거와 함께 답합니다. 문서에서 문장을 골라 인용할 수 있습니다.</p>
          </div>
          <section id="messages" class="space-thread" aria-label="질문과 답변"></section>
          <button id="jump-bottom" class="space-float jump" type="button" hidden>새 답변으로 ↓</button>
        </div>
        <button id="quote-selection" class="space-float quote" type="button" hidden>선택한 내용에 질문 ↗</button>

        <!-- composer -->
        <div class="space-dock shrink-0">
          <div class="attachment-tray">
            <button id="annotation-count" class="annotation-count" type="button" hidden></button>
            <div id="annotation-list" hidden></div>
            <div id="quote-box" class="quote-box" hidden><div><span id="quote-label">인용</span><button id="clear-quote" class="quiet" type="button" aria-label="인용 지우기">×</button></div><blockquote id="quote-text"></blockquote></div>
          </div>
          <form id="composer" class="composer">
            <textarea id="message-input" rows="1" maxlength="10000" aria-label="메시지" placeholder="질문 · /next 로 다음 설명"></textarea>
            <button id="send" class="send-button" type="submit" aria-label="보내기">↑</button>
          </form>
          <p id="form-status" class="form-status" role="status"></p>
        </div>
      </aside>

      <!-- space header -->
      <div id="space-header" class="flex min-w-0 items-center gap-1">
        <div id="space-dd" class="relative min-w-[4.5rem] max-w-[16rem] shrink">
          <button type="button" id="btn-space" aria-haspopup="listbox" aria-expanded="false" class="flex min-w-0 max-w-full items-center gap-1 rounded-lg px-2 py-1 text-left hover:bg-slate-50 transition duration-150">
            <span id="space-title" class="truncate text-[13px] font-semibold tracking-tight text-slate-900">Space</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5 shrink-0 text-slate-400"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <div id="space-menu" role="listbox" class="hidden absolute left-0 top-full mt-1 z-50 w-72 max-md:fixed max-md:left-4 max-md:right-4 max-md:top-12 max-md:w-auto max-h-80 overflow-y-auto rounded-xl bg-white p-1 shadow-lg ring-1 ring-slate-200"></div>
        </div>
        <span class="shrink-0 text-slate-300">/</span>
        <div id="conversation-dd" class="relative min-w-0 max-w-[20rem] shrink">
          <button type="button" id="btn-conversation" aria-haspopup="listbox" aria-expanded="false" class="flex min-w-0 max-w-full items-center gap-1 rounded-lg px-2 py-1 text-left hover:bg-slate-50 transition duration-150">
            <span id="conversation-title" class="min-w-0 truncate text-[13px] text-slate-500">새 대화</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-3.5 w-3.5 shrink-0 text-slate-400"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <div id="conversation-menu" role="listbox" class="hidden absolute left-0 top-full mt-1 z-50 w-72 max-md:fixed max-md:left-4 max-md:right-4 max-md:top-12 max-md:w-auto max-h-80 overflow-y-auto rounded-xl bg-white p-1 shadow-lg ring-1 ring-slate-200"></div>
        </div>
      </div>
