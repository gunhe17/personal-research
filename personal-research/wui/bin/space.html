<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
{{include partial/head.html}}
<link rel="stylesheet" href="/viewer/space.css" />
</head>
<body data-page="space" class="booting h-full bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden select-text">

  <div class="h-full flex flex-col">
{{include partial/header.html}}
    <div class="flex-1 min-h-0 flex relative">
{{include partial/sidebar.html}}
    <!-- Workspace -->
    <div id="workspace" class="relative flex-1 min-w-0 min-h-0 flex">
      <main id="space-page" class="flex-1 min-h-0 overflow-y-auto bg-slate-50">
        <div id="space-content" class="mx-auto w-full max-w-4xl px-6 py-12"></div>
      </main>
    </div>
    </div>
  </div>

{{include partial/overlay.html}}
  <div id="space-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 enter-fade" role="dialog" aria-modal="true" aria-labelledby="space-modal-heading">
    <div class="w-full max-w-md flex flex-col rounded-3xl bg-white shadow-2xl overflow-hidden enter-rise">
      <div class="flex items-center gap-2 px-5 pt-5 pb-3">
        <h3 id="space-modal-heading" class="text-sm font-semibold text-slate-900 flex-1">New space</h3>
        <button type="button" id="space-modal-close" class="icon-btn shrink-0" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="h-4 w-4"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="px-5 py-3 space-y-4">
        <label class="block">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">이름</span>
          <input id="space-modal-title" placeholder="예: 트랜스포머 학습" class="mt-1.5 w-full rounded-xl bg-slate-50 px-3.5 py-2.5 text-[15px] text-slate-900 ring-1 ring-slate-200 focus:outline-none focus:ring-2 focus:ring-apple/30" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">목적</span>
          <textarea id="space-modal-purpose" rows="4" placeholder="무엇을, 어떤 순서로, 어디까지 배울지. 나중에 고칠 수 있습니다." class="mt-1.5 w-full resize-y rounded-xl bg-slate-50 px-3.5 py-2.5 text-[15px] leading-relaxed text-slate-900 ring-1 ring-slate-200 focus:outline-none focus:ring-2 focus:ring-apple/30"></textarea>
        </label>
        <p id="space-modal-error" class="hidden text-[13px] text-red-600"></p>
      </div>
      <div class="flex justify-end gap-2 bg-slate-50 px-5 py-4">
        <button type="button" id="space-modal-cancel" class="rounded-full border border-slate-300 px-4 py-1.5 text-[15px] text-slate-700 hover:bg-white transition">Cancel</button>
        <button type="button" id="space-modal-create" class="rounded-full bg-apple px-4 py-1.5 text-[15px] text-white hover:bg-apple-hover transition">Create</button>
      </div>
    </div>
  </div>
  <script src="/viewer/app.js"></script>
</body>
</html>
