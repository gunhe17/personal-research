<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: {
        sans: ['"SF Pro Text"', "-apple-system", "BlinkMacSystemFont", "Inter", "Pretendard", "system-ui", "sans-serif"],
        mono: ['"SF Mono"', "ui-monospace", "monospace"],
      },
      colors: {
        slate: { 50: "#f5f5f7", 100: "#e8e8ed", 200: "#d2d2d7", 300: "#b4b4b9", 400: "#858585",
                 500: "#707070", 600: "#474747", 700: "#333333", 800: "#1d1d1f", 900: "#1d1d1f" },
        apple: { DEFAULT: "#0071e3", hover: "#0077ed", link: "#0066cc" },
        ice: "#f4f8fb",
      },
    } },
  };
</script>
<style type="text/tailwindcss">
  body { letter-spacing: -0.016em; }
  .pane { @apply relative flex min-w-0 flex-col transition duration-200; }
  .bar { @apply relative flex h-[34px] shrink-0 items-center gap-1.5 border-b px-2.5 transition duration-200; }
  .x { @apply grid h-[22px] w-[22px] place-items-center rounded-md text-[15px] leading-none text-slate-400 hover:bg-slate-200 hover:text-slate-800; }
  .line { @apply h-2 rounded bg-slate-100; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased">

<div class="mx-auto max-w-6xl px-6 py-12">
  <header class="mb-12">
    <h1 class="text-[40px] font-semibold tracking-tight" style="letter-spacing: 0.44px">Focus Lab</h1>
    <p class="mt-2 text-[17px] font-light text-slate-500">화면을 나눴을 때 지금 포커스된 그룹을 어떻게 보여 줄지. 각 시안의 그룹을 눌러 포커스를 옮겨 보세요. 포커스는 인용을 받을 대화, 사이드바로 열 자리를 정하므로 한눈에 보여야 합니다.</p>
  </header>
  <div class="space-y-14" id="variants"></div>
</div>

<script>
  const GROUPS = [
    { kind: "conversation", name: "README 첫 문장을 한 줄로 요약해줘", body: "chat" },
    { kind: "collected", name: "README.md", body: "doc" },
    { kind: "materials", name: "Lesson 1 · 손실 함수", body: "doc" },
  ];
  const VARIANTS = [
    { id: "F1", title: "F1. 위쪽 파란 선 (지금)", note: "그룹 맨 위 2px 선. 가볍지만 바 글씨가 모두 같아 멀리서 잘 안 보임.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-400", "text-slate-400"], name: ["text-slate-700", "text-slate-700"], top: "bg-apple" },
    { id: "F2", title: "F2. 바 글씨 대비", note: "선 없이 글씨로만. 포커스는 제목이 진하고 굵게, 나머지는 흐리게. 가장 조용함.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-500", "text-slate-300"], name: ["font-semibold text-slate-900", "text-slate-400"] },
    { id: "F3", title: "F3. 바 바탕 구분", note: "포커스 바는 흰 바탕, 나머지 바는 회색(slate-50). 탭 막대처럼 보임.",
      pane: ["bg-white", "bg-white"], bar: ["bg-white border-slate-100", "bg-slate-50 border-slate-200"], kind: ["text-slate-400", "text-slate-300"], name: ["text-slate-900", "text-slate-500"] },
    { id: "F4", title: "F4. 바 아래 밑줄", note: "포커스 바의 제목 아래 2px 파란 밑줄(탭의 밑줄). 위치가 제목에 붙어 무엇이 활성인지 바로 읽힘.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-400", "text-slate-400"], name: ["text-slate-900", "text-slate-500"], underline: true },
    { id: "F5", title: "F5. 나머지 그룹 흐리게", note: "포커스 그룹은 그대로, 나머지는 본문까지 살짝 흐리게(70%). 눈이 바로 포커스로 감. 비교하며 읽을 땐 방해될 수 있음.",
      pane: ["bg-white", "bg-white opacity-70"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-400", "text-slate-400"], name: ["text-slate-900", "text-slate-500"] },
    { id: "F6", title: "F6. 제목 앞 점", note: "포커스 바 제목 앞에 6px 파란 점. 사이드바의 상태 점과 같은 언어.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-400", "text-slate-400"], name: ["text-slate-900", "text-slate-500"], dot: true },
    { id: "F7", title: "F7. 테두리 링", note: "포커스 그룹 둘레에 얇은 파란 링(1px, 30%). 영역 전체가 활성이라는 느낌. 선이 늘어 화면이 조금 무거워짐.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-400", "text-slate-400"], name: ["text-slate-900", "text-slate-500"], ring: true },
    { id: "F8", title: "F8. 위쪽 선 + 바 글씨 대비", note: "F1 과 F2 를 합침. 선이 위치를, 글씨가 내용을 알려 줌. 지금 모양에서 가장 작은 변경.",
      pane: ["bg-white", "bg-white"], bar: ["border-slate-100", "border-slate-100"], kind: ["text-slate-500", "text-slate-300"], name: ["font-medium text-slate-900", "text-slate-400"], top: "bg-apple" },
  ];

  const body = (kind) => kind === "chat"
    ? `<div class="space-y-3 p-4"><div class="ml-auto h-8 w-2/3 rounded-xl bg-slate-100"></div><div class="line w-1/3"></div><div class="line w-11/12"></div><div class="line w-10/12"></div><div class="line w-7/12"></div></div>`
    : `<div class="space-y-2.5 p-4"><div class="h-3 w-1/2 rounded bg-slate-200"></div><div class="line w-full"></div><div class="line w-11/12"></div><div class="line w-full"></div><div class="line w-9/12"></div><div class="line w-10/12"></div></div>`;

  const root = document.getElementById("variants");
  for (const v of VARIANTS) {
    const section = document.createElement("section");
    section.innerHTML = `<h2 class="text-[21px] font-semibold tracking-tight">${v.title}</h2><p class="mb-4 mt-1 max-w-3xl text-[14px] text-slate-500">${v.note}</p><div data-stage class="grid h-64 grid-cols-3 gap-px overflow-hidden rounded-xl border border-slate-200 bg-slate-100"></div>`;
    root.appendChild(section);
    const stage = section.querySelector("[data-stage]");
    const show = (focus) => {
      stage.innerHTML = GROUPS.map((g, i) => {
        const on = i === focus ? 0 : 1;
        return `<div data-group="${i}" class="pane cursor-pointer ${v.pane[on]} ${v.ring && !on ? "z-10 ring-1 ring-inset ring-apple/30" : ""}">
          ${v.top && !on ? `<span class="pointer-events-none absolute inset-x-0 top-0 z-10 h-0.5 ${v.top}"></span>` : ""}
          <div class="bar ${v.bar[on]}">
            ${v.dot && !on ? `<span class="h-1.5 w-1.5 shrink-0 rounded-full bg-apple"></span>` : ""}
            <span class="text-[12px] ${v.kind[on]}">${g.kind}</span>
            <span class="text-[12px] text-slate-200">/</span>
            <span class="relative mr-auto min-w-0 truncate text-[12px] ${v.name[on]}">${g.name}</span>
            ${v.underline && !on ? `<span class="pointer-events-none absolute bottom-[-1px] left-2.5 right-9 h-0.5 bg-apple"></span>` : ""}
            <span class="x">×</span>
          </div>
          ${body(g.body)}
        </div>`;
      }).join("");
      stage.querySelectorAll("[data-group]").forEach((node) => node.addEventListener("click", () => show(Number(node.dataset.group))));
    };
    show(0);
  }
</script>
</body>
</html>
