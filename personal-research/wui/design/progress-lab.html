<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Progress Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: {
        sans: ['"SF Pro Text"', "-apple-system", "BlinkMacSystemFont", "Inter", "Pretendard", "system-ui", "sans-serif"],
        mono: ['"SF Mono"', "ui-monospace", "monospace"],
      },
      colors: {
        slate: { 50: "#f5f5f7", 100: "#e8e8ed", 200: "#d2d2d7", 300: "#b4b4b9", 400: "#858585",
                 500: "#707070", 600: "#474747", 700: "#333333", 800: "#1d1d1f", 900: "#1d1d1f" },
        apple: { DEFAULT: "#0071e3", hover: "#0077ed", link: "#0066cc" },
      },
      transitionTimingFunction: { spring: "cubic-bezier(0.22, 1, 0.36, 1)" },
    } },
  };
</script>
<style type="text/tailwindcss">
  body { letter-spacing: -0.016em; }
  @keyframes step-in { from { opacity: 0; transform: translateY(-4px); } }
  .step-in { animation: step-in 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
  .breathe { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes sweep { to { background-position: 200% 0; } }
  .sweep {
    background-image: linear-gradient(90deg, #1d1d1f 0%, #1d1d1f 40%, #0071e3 50%, #1d1d1f 60%, #1d1d1f 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sweep 2.2s linear infinite;
  }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased">

<div class="mx-auto max-w-5xl px-6 py-10">

  <header class="mb-8">
    <h1 class="text-[28px] font-semibold tracking-tight text-slate-800">Progress Lab</h1>
    <p class="mt-1 text-[14px] font-light text-slate-500">
      수집 절차가 쌓이는 방식 세 가지. 서버가 실제로 보내는 이벤트를 그대로 재생합니다.
    </p>
  </header>

  <div class="mb-6 flex flex-wrap items-center gap-2">
    <div id="scenarios" class="inline-flex items-center rounded-full bg-slate-100 p-0.5"></div>
    <button id="replay" class="rounded-full bg-apple px-4 py-1.5 text-sm text-white hover:bg-apple-hover transition duration-150">재생</button>
    <button id="speed" class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-50 transition duration-150">1×</button>
  </div>

  <div class="grid gap-5 md:grid-cols-3">

    <!-- A -->
    <section class="rounded-xl border border-slate-200 bg-white p-4">
      <div class="mb-3 flex items-baseline justify-between">
        <h2 class="text-[13px] font-semibold text-slate-800">A. Timeline</h2>
        <span class="text-[11px] text-slate-400">세로선 + 상태 점</span>
      </div>
      <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-2">Agent</div>
      <div id="a" class="relative"></div>
      <div id="a-tail" class="mt-3 hidden border-t border-slate-100 pt-2.5"></div>
    </section>

    <!-- B -->
    <section class="rounded-xl border border-slate-200 bg-white p-4">
      <div class="mb-3 flex items-baseline justify-between">
        <h2 class="text-[13px] font-semibold text-slate-800">B. Log</h2>
        <span class="text-[11px] text-slate-400">한 줄씩 쌓임</span>
      </div>
      <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-2">Agent</div>
      <div id="b" class="space-y-0.5 font-mono text-[11px] leading-relaxed"></div>
      <div id="b-tail" class="mt-3 hidden border-t border-slate-100 pt-2.5"></div>
    </section>

    <!-- C -->
    <section class="rounded-xl border border-slate-200 bg-white p-4">
      <div class="mb-3 flex items-baseline justify-between">
        <h2 class="text-[13px] font-semibold text-slate-800">C. Summary</h2>
        <span class="text-[11px] text-slate-400">한 줄 요약 + 펼치기</span>
      </div>
      <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-2">Agent</div>
      <div id="c"></div>
      <div id="c-tail" class="mt-3 hidden border-t border-slate-100 pt-2.5"></div>
    </section>

  </div>

  <p class="mt-8 text-[12px] text-slate-400">
    이벤트: <code class="rounded bg-slate-100 px-1 py-0.5">{"type":"step","key":"fetch","text":"…","state":"running|done|skip|error"}</code>
  </p>
</div>

<script>
  const $ = (s) => document.querySelector(s);

  // 서버가 실제로 보내는 흐름
  const SCENARIOS = {
    "성공": [
      [0,    { type: "step", key: "detect",    text: "Reading the input",                     state: "running" }],
      [600,  { type: "step", key: "detect",    text: "Detected X article",                    state: "done" }],
      [120,  { type: "step", key: "fetch",     text: "Fetching the original",                 state: "running" }],
      [2200, { type: "step", key: "fetch",     text: "New document, 26,928 chars",            state: "done" }],
      [80,   { type: "collected", path: "docs/x/shmidtqq/article/grok-bot-how-to-hand-your-routine-to-a-bot-in-10-steps.md" }],
      [120,  { type: "step", key: "translate", text: "Translating to Korean",                 state: "running" }],
      [5200, { type: "step", key: "translate", text: "Korean 17,040 chars",                   state: "done" }],
      [120,  { type: "step", key: "check",     text: "Checking consistency",                  state: "running" }],
      [900,  { type: "step", key: "check",     text: "1,136 originals, 71 translations, 0 problems", state: "done" }],
      [150,  { type: "done", text: "docs/x/shmidtqq/article/grok-bot-how-to-hand-your-routine-to-a-bot-in-10-steps.md" }],
    ],
    "건너뜀": [
      [0,    { type: "step", key: "detect",    text: "Reading the input",                  state: "running" }],
      [500,  { type: "step", key: "detect",    text: "Detected GitHub repository card",    state: "done" }],
      [120,  { type: "step", key: "fetch",     text: "Fetching the original",              state: "running" }],
      [1400, { type: "step", key: "fetch",     text: "Saved the repository card",          state: "done" }],
      [80,   { type: "collected", path: "repos/github/microsoft/Orchard" }],
      [100,  { type: "step", key: "translate", text: "Repository cards are not translated", state: "skip" }],
      [120,  { type: "step", key: "check",     text: "Checking consistency",               state: "running" }],
      [800,  { type: "step", key: "check",     text: "1,136 originals, 71 translations, 0 problems", state: "done" }],
      [150,  { type: "done", text: "repos/github/microsoft/Orchard" }],
    ],
    "실패": [
      [0,    { type: "step", key: "detect", text: "Reading the input",   state: "running" }],
      [500,  { type: "step", key: "detect", text: "Detected X article",  state: "done" }],
      [120,  { type: "step", key: "fetch",  text: "Fetching the original", state: "running" }],
      [2400, { type: "step", key: "fetch",  text: "Fetch failed: tweet has no article", state: "error" }],
      [150,  { type: "done", text: "Nothing was collected." }],
    ],
  };

  const MARK = {
    running: `<span class="breathe block h-[7px] w-[7px] rounded-full bg-apple"></span>`,
    done:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="h-[11px] w-[11px] text-slate-400"><path d="M4 12.5l5 5L20 6.5"/></svg>`,
    skip:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="h-[11px] w-[11px] text-slate-300"><path d="M5 12h14"/></svg>`,
    error:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="h-[11px] w-[11px] text-red-500"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>`,
  };

  const LABEL = { detect: "판별", fetch: "수집", translate: "번역", check: "검사" };

  let steps = [];
  let started = 0;
  let timers = [];
  let speed = 1;
  let current = "성공";

  function ms(v) { return v < 1000 ? `${v}ms` : `${(v / 1000).toFixed(1)}s`; }

  function upsert(ev) {
    const now = performance.now();
    const at = steps.findIndex((s) => s.key === ev.key);
    if (at >= 0) {
      const was = steps[at];
      steps[at] = { ...was, text: ev.text, state: ev.state, took: now - was.at };
    } else {
      steps.push({ key: ev.key, text: ev.text, state: ev.state, at: now, took: null });
    }
  }

  // A. Timeline
  function renderA() {
    const box = $("#a");
    box.innerHTML = steps.map((s, i) => {
      const last = i === steps.length - 1;
      const dim = s.state === "skip" ? "text-slate-400" : s.state === "running" ? "text-slate-800" : "text-slate-500";
      return `
        <div class="step-in relative flex gap-2.5 ${last ? "" : "pb-2.5"}">
          ${last ? "" : `<span class="absolute left-[5px] top-[15px] bottom-0 w-px bg-slate-200"></span>`}
          <span class="relative z-10 mt-[4px] flex h-[11px] w-[11px] shrink-0 items-center justify-center rounded-full bg-white">${MARK[s.state]}</span>
          <span class="min-w-0 flex-1 text-[12px] ${dim} ${s.state === "running" ? "sweep" : ""}">${s.text}</span>
          <span class="shrink-0 pt-px font-mono text-[10px] tabular-nums text-slate-300">${s.took != null ? ms(s.took) : ""}</span>
        </div>`;
    }).join("");
  }

  // B. Log
  function renderB() {
    const box = $("#b");
    const glyph = { running: "›", done: "✓", skip: "–", error: "✕" };
    const tone = { running: "text-apple", done: "text-slate-500", skip: "text-slate-300", error: "text-red-500" };
    box.innerHTML = steps.map((s) => `
      <div class="step-in flex gap-2">
        <span class="w-3 shrink-0 ${tone[s.state]}">${glyph[s.state]}</span>
        <span class="w-16 shrink-0 text-slate-400">${LABEL[s.key] || s.key}</span>
        <span class="min-w-0 flex-1 ${s.state === "skip" ? "text-slate-400" : "text-slate-600"}">${s.text}</span>
        <span class="shrink-0 tabular-nums text-slate-300">${s.took != null ? ms(s.took) : ""}</span>
      </div>`).join("");
  }

  // C. Summary
  let expanded = false;
  function renderC() {
    const box = $("#c");
    const running = steps.find((s) => s.state === "running");
    const failed = steps.some((s) => s.state === "error");
    const total = steps.length;
    const settled = steps.filter((s) => s.state !== "running").length;
    const head = failed ? "수집하지 못했습니다" : running ? running.text : "끝났습니다";
    box.innerHTML = `
      <button id="c-head" class="flex w-full items-center gap-2 rounded-lg px-1 py-1 text-left hover:bg-slate-50 transition duration-150">
        <span class="flex h-[11px] w-[11px] shrink-0 items-center justify-center">${
          failed ? MARK.error : running ? MARK.running : MARK.done
        }</span>
        <span class="min-w-0 flex-1 truncate text-[12px] ${running ? "sweep" : "text-slate-600"}">${head}</span>
        <span class="shrink-0 font-mono text-[10px] tabular-nums text-slate-300">${settled}/${total}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             class="h-3 w-3 shrink-0 text-slate-300 transition-transform ${expanded ? "rotate-180" : ""}"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="${expanded ? "" : "hidden"} mt-1.5 space-y-1 border-l border-slate-100 pl-3">
        ${steps.map((s) => `
          <div class="flex items-start gap-2 text-[11px]">
            <span class="mt-[3px] flex h-[11px] w-[11px] shrink-0 items-center justify-center">${MARK[s.state]}</span>
            <span class="min-w-0 flex-1 ${s.state === "skip" ? "text-slate-400" : "text-slate-600"}">${s.text}</span>
            <span class="shrink-0 font-mono text-[10px] tabular-nums text-slate-300">${s.took != null ? ms(s.took) : ""}</span>
          </div>`).join("")}
      </div>`;
    $("#c-head").addEventListener("click", () => { expanded = !expanded; renderC(); });
  }

  function renderTail(id, ev) {
    const box = $(id);
    box.classList.remove("hidden");
    const failed = ev.text.startsWith("Nothing");
    box.innerHTML = failed
      ? `<p class="text-[12px] text-slate-500">${ev.text}</p>`
      : `<div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Sources</div>
         <a class="block truncate text-[11px] text-apple-link hover:underline" href="#">${ev.text}</a>`;
  }

  function renderAll() { renderA(); renderB(); renderC(); }

  function play(name) {
    current = name;
    timers.forEach(clearTimeout);
    timers = [];
    steps = [];
    expanded = false;
    ["#a-tail", "#b-tail", "#c-tail"].forEach((id) => { $(id).classList.add("hidden"); $(id).innerHTML = ""; });
    renderAll();
    started = performance.now();
    let clock = 0;
    for (const [delay, ev] of SCENARIOS[name]) {
      clock += delay / speed;
      timers.push(setTimeout(() => {
        if (ev.type === "step") { upsert(ev); renderAll(); }
        else if (ev.type === "done") { ["#a-tail", "#b-tail", "#c-tail"].forEach((id) => renderTail(id, ev)); }
      }, clock));
    }
    document.querySelectorAll("[data-scenario]").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.scenario === name));
      b.className = b.dataset.scenario === name
        ? "rounded-full bg-white px-3 py-1 text-[12px] font-medium text-slate-800 transition duration-150"
        : "rounded-full px-3 py-1 text-[12px] text-slate-500 hover:text-slate-800 transition duration-150";
    });
  }

  $("#scenarios").innerHTML = Object.keys(SCENARIOS)
    .map((n) => `<button type="button" data-scenario="${n}"></button>`).join("");
  document.querySelectorAll("[data-scenario]").forEach((b) => {
    b.textContent = b.dataset.scenario;
    b.addEventListener("click", () => play(b.dataset.scenario));
  });
  $("#replay").addEventListener("click", () => play(current));
  $("#speed").addEventListener("click", () => {
    speed = speed === 1 ? 3 : speed === 3 ? 8 : 1;
    $("#speed").textContent = speed + "×";
    play(current);
  });

  play("성공");
</script>
</body>
</html>
