name: personal-research-develop

services:
  api:
    container_name: personal-research-develop-api
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.api
    volumes:
      - ..:/app
      - claude-config:/root/.claude
    ports:
      - "127.0.0.1:${DEVELOP_API_PORT}:${PORT}"
    env_file:
      - ../.env/.env.develop

  wui:
    container_name: personal-research-develop-wui
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.wui
    volumes:
      - ..:/app
      - wui-modules:/app/personal-research/wui/node_modules
    environment:
      API_URL: http://api:${PORT}
    ports:
      - "127.0.0.1:${DEVELOP_WUI_PORT}:3000"
    depends_on:
      - api

volumes:
  claude-config:
  wui-modules:
