name: personal-research-production

services:
  api:
    container_name: personal-research-production-api
    build:
      context: ..
      dockerfile: .docker/Dockerfile.production.api
    restart: unless-stopped
    volumes:
      - ../personal-research/api/database:/app/personal-research/api/database
      - claude-config:/root/.claude
    ports:
      - "127.0.0.1:${PRODUCTION_API_PORT}:${PORT}"
    env_file:
      - ../.env/.env.production

  wui:
    container_name: personal-research-production-wui
    build:
      context: ..
      dockerfile: .docker/Dockerfile.production.wui
      args:
        API_URL: http://api:${PORT}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCTION_WUI_PORT}:3000"
    depends_on:
      - api

volumes:
  claude-config:
